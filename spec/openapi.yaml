openapi: 3.0.3
info:
  title: NcloudGo — Naver Cloud Platform OpenAPI
  description: |-
    Reconstructed OpenAPI 3.0 specification for Naver Cloud Platform (NCP).

    Two authoritative sources are merged:
      1. Go SDK: github.com/NaverCloudPlatform/ncloud-sdk-go-v2 @ 6eac36b
         → 20 VPC-era services (520 operations), parsed via AST + canonical
           semantic types.
      2. Public docs portal: api.ncloud-docs.com (Document360)
         → 57 services (1426 operations) NOT in the Go SDK, extracted via
           `tools/docparse.py`.

    Total: 77 services, 1946 operations, 1946 verified (100%).

    Each service spec lives in `./services/<name>.yaml` and lint-passes OpenAPI
    3.0.3 independently. This root document is an index — it does not merge
    paths; consumers should pick a service file directly or use a tool that
    walks `x-service-files[].path` entries.

    Three-environment servers (민간/금융/공공) are declared per service using the
    `x-ncloud-env` vendor extension. See README for details.
  version: 2.0.0
paths: {}
components:
  securitySchemes:
    ncpHmacV2:
      type: apiKey
      in: header
      name: x-ncp-apigw-signature-v2
    ncpAccessKey:
      type: apiKey
      in: header
      name: x-ncp-iam-access-key
    ncpTimestamp:
      type: apiKey
      in: header
      name: x-ncp-apigw-timestamp
x-ncloud-environments:
- key: public
  domain: ntruss.com
  label: 민간
- key: financial
  domain: fin-ntruss.com
  label: 금융
- key: gov
  domain: gov-ntruss.com
  label: 공공
