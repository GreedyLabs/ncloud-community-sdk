          description: '모델 반복 실행 시 결괏값의 일관성 수준 조정 0: 일관성 수준 랜덤 적용 (기본값) 1 ≤ seed ≤ 4294967295: 일관되게 생성하고자 하는 결괏값의 seed 값 또는 사용자가 지정하고자 하는 seed 값'
        - name: includeAiFilters
          in: query
          required: false
          schema:
            type: boolean
          description: 'AI 필터(생성된 결괏값에 대해 욕설, 비하/차별/혐오, 성희롱/음란 등 카테고리별로 해당하는 정도) 결과 표시 여부 true | false (기본값) true : 표시 false : 표시 안 함'
        - name: role
          in: query
          required: true
          schema:
            type: string
          description: '대화 메시지 역할 system | user | assistant system : 역할을 규정하는 지시문 user : 사용자의 발화 또는 질문 assistant : 사용자의 발화 또는 질문에 대한 답변'
        - name: content
          in: query
          required: true
          schema:
            type: string
          description: '대화 메시지 내용 텍스트 입력(String) 텍스트 입력(Array): content'
        - name: type
          in: query
          required: true
          schema:
            type: string
          description: 대화 메시지 내용의 형식 text (유효 값)
        - name: text
          in: query
          required: false
          schema:
            type: string
          description: 대화 메시지 내용 텍스트 입력 type 이 text 인 경우, 필수 입력
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: object
                    additionalProperties: true
                    description: 응답 상태 참조
                  result:
                    type: object
                    additionalProperties: true
                    description: 응답 결과
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: CLOVA Studio API Key as a Bearer token.
    clovaStudioRequestId:
      type: apiKey
      in: header
      name: X-NCP-CLOVASTUDIO-REQUEST-ID
      description: Caller-supplied request ID. Echoed back in error responses for tracing.
  schemas:
    NcloudErrorEnvelope:
      type: object
      description: 'Naver Cloud Platform standard error envelope. Most products return this shape; some (Object Storage, CLOVA) wrap differently — `additionalProperties: true` keeps clients tolerant.'
      properties:
        responseError:
          type: object
          description: 'Error detail (present on most NCP product errors). Field shape varies; `additionalProperties: true` keeps clients tolerant.'
          properties:
            returnCode:
              type: string
              description: NCP error code.
            returnMessage:
              type: string
              description: Human-readable error message.
          additionalProperties: true
        error:
          description: 'Alternative error field. Type varies: object (CLOVA, NCP standard), string (cert-manager Spring Boot 404), or null.'
      additionalProperties: true
  responses:
    NcloudClientError:
      description: Client error (4xx) — NCP error envelope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NcloudErrorEnvelope'
    NcloudServerError:
      description: Server error (5xx) — NCP error envelope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NcloudErrorEnvelope'
