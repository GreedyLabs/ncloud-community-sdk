                    description: 프로젝트 아이디
                  member_id:
                    type: string
                    description: 사용자 아이디
                  name:
                    type: string
                    description: 사용자 이름
                  profile:
                    type: string
                    description: 사용자 프로필 이미지
                  memo:
                    type: string
                    description: 사용자에 대한 메모
                  country:
                    type: string
                    description: 접속 국가
                  remoteip:
                    type: string
                    description: 접속 IP 주소
                  adid:
                    type: string
                    description: 광고 아이디
                  device:
                    type: string
                    description: 디바이스
                  network:
                    type: string
                    description: 네트워크
                  version:
                    type: string
                    description: 버전
                  model:
                    type: string
                    description: 모델
                  deleted:
                    type: boolean
                    description: '탈퇴 여부 true | false true : 탈퇴 false : 탈퇴 안 함'
                  online:
                    type: boolean
                    description: '온라인 여부 true | false true : 온라인 false : 오프라인'
                  customField:
                    type: string
                    description: 사용자 정의 필드
                  device_type:
                    type: array
                    items:
