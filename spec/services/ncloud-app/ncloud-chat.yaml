                  project_id:
                    type: string
                    description: 프로젝트 아이디
                  name:
                    type: string
                    description: 채널 이름
                  user_id:
                    type: string
                    description: 채널 생성자 아이디
                  user:
                    type: object
                    additionalProperties: true
                    description: 생성자 정보
                  unique_id:
                    type: string
                    description: 채널 고유 아이디 고유 식별 용도로 사용자가 입력하는 아이디
                  type:
                    type: string
                    description: '채널 유형 PUBLIC | PRIVATE PUBLIC : 공개 PRIVATE : 비공개'
                  translation:
                    type: boolean
                    description: '자동 번역 여부 true | false true : 번역 false : 번역 안 함'
                  members:
