openapi: 3.0.3
info:
  title: Ncloud Chat
  description: Ncloud Chat
  version: 1.0.0
  x-ncloud-availability:
    public: true
    financial: false
    gov: false

  x-ncloud-nrn:

    productName: NcloudChat
    resource_types:
      - Project

servers:
  - url: https://dashboard-api.ncloudchat.naverncp.com
    description: ncloud-chat 민간
    x-ncloud-env: public
security:
  # NCloud Chat uses a per-project key + project ID — NOT IAM HMAC.
  - ncloudChatApiKey: []
    ncloudChatProjectId: []
paths:
  /v1/api/channels:
    get:
      operationId: ChannelList
      summary: 채널 목록 조회
      description: Classic/VPC 환경에서 이용 가능합니다.
      tags:
        - ncloud-chat

      x-ncloud-source: https://api.ncloud-docs.com/docs/bizapp-ncloudchat-channellist
      parameters:
        - name: filter
          in: query
          required: true
          schema:
            type: string
          description: 필터링 조건 응답 바디의 일부 필드를 기준으로 필터링 전체 일치하는 값만 필터링 조건이 없는 경우, 빈 값 {} 입력 <예시> {"id":"{채널아이디}"} , {"name":"{채널이름}"} , {"disabled":false}
        - name: sort
          in: query
          required: false
          schema:
            type: string
          description: '정렬 기준 {기준:방식} 형태로 입력 기준: 응답 바디의 String 타입 필드 방식: -1 | 1 -1 : 내림차순 1 : 오름차순 <예시> {"createdAt":"-1"} : 생성 일시 기준 내림차순'
        - name: option
          in: query
          required: false
          schema:
            type: string
          description: '추가 옵션: Option <예시> {"offset":0,"per_page":20} : 첫 번째 항목부터 20개 표시'
        - name: offset
          in: query
          required: false
          schema:
            type: number
          description: 조회 시작점 0~N
        - name: per_page
          in: query
          required: false
          schema:
            type: number
          description: 페이지당 항목 수 1~100
        - name: count
          in: query
          required: false
          schema:
            type: boolean
          description: '목록 대신 응답 결과 수 표시 여부 true | false true : 응답 결과 수 표시 false : 목록 표시'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: 채널 아이디
                  project_id:
                    type: string
                    description: 프로젝트 아이디
                  name:
                    type: string
                    description: 채널 이름
                  user_id:
                    type: string
                    description: 채널 생성자 아이디
                  user:
                    type: object
                    additionalProperties: true
                    description: 생성자 정보
                  unique_id:
                    type: string
                    description: 채널 고유 아이디 고유 식별 용도로 사용자가 입력하는 아이디
                  type:
                    type: string
                    description: '채널 유형 PUBLIC | PRIVATE PUBLIC : 공개 PRIVATE : 비공개'
                  translation:
                    type: boolean
                    description: '자동 번역 여부 true | false true : 번역 false : 번역 안 함'
                  members:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                    description: 구독 가능한 사용자 아이디 목록 type 이 PRIVATE 인 경우, 유효 값 표시
                  disabled:
                    type: boolean
                    description: '비활성화 여부 true | false true : 비활성화 false : 활성화'
                  mutes:
                    type: boolean
                    description: '음소거 여부 true | false true : 음소거 false : 음소거 안 함'
                  push:
                    type: boolean
                    description: '푸시 알림 허용 여부 true | false true : 허용 false : 차단'
                  limit:
                    type: integer
                    description: '최대 참여 인원 수 0 : 무제한'
                  link_url:
                    type: string
                    description: 채널 링크 URL
                  image_url:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                    description: 채널 이미지 URL
                  created_at:
                    type: string
                    description: 채널 생성 일시 ISO 8601 형식
                  updated_at:
                    type: string
                    description: 정보 수정 일시 ISO 8601 형식
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
    post:
      operationId: ChannelCreate
      summary: 채널 생성
      description: Classic/VPC 환경에서 이용 가능합니다.
      tags:
        - ncloud-chat

      x-ncloud-source: https://api.ncloud-docs.com/docs/bizapp-ncloudchat-channelcreate
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
          description: 채널 이름
        - name: uniqueId
          in: query
          required: false
          schema:
            type: string
          description: 채널 고유 아이디 고유 식별 용도로 사용자가 입력하는 아이디
        - name: type
          in: query
          required: true
          schema:
            type: string
          description: '채널 유형 PUBLIC | PRIVATE PUBLIC : 공개 PRIVATE : 비공개'
        - name: translation
          in: query
          required: false
          schema:
            type: boolean
          description: '자동 번역 여부 true | false (기본값) true : 번역 false : 번역 안 함'
        - name: members
          in: query
          required: false
          schema:
            type: array
            items:
              type: object
              additionalProperties: true
          description: 구독 가능한 사용자 아이디 목록 type 이 PRIVATE 인 경우, 입력
        - name: disabled
          in: query
          required: false
          schema:
            type: boolean
          description: '비활성화 여부 true | false (기본값) true : 비활성화 false : 활성화'
        - name: mutes
          in: query
          required: false
          schema:
            type: boolean
          description: '음소거 여부 true | false (기본값) true : 음소거 false : 음소거 안 함'
        - name: push
          in: query
          required: false
          schema:
            type: boolean
          description: '푸시 알림 허용 여부 true (기본값) | false true : 허용 false : 차단'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
          description: '최대 참여 인원 수 0 : 무제한'
        - name: linkUrl
          in: query
          required: false
          schema:
            type: string
          description: 채널 링크 URL 일정 조건을 만족하는 URL 입력
        - name: imageUrl
          in: query
          required: false
          schema:
            type: string
          description: 채널 이미지 URL 일정 조건을 만족하는 URL 입력
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  channel:
                    type: object
                    additionalProperties: true
                    description: 채널 정보
                  status:
                    type: integer
                    description: '응답 상태 1 : 성공 1 이 아닌 경우: 실패'
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
  /v1/api/channels/{channelId}:
    get:
      operationId: ChannelDetail
      summary: 채널 조회
      description: Classic/VPC 환경에서 이용 가능합니다.
