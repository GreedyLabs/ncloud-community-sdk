                  updated_at:
                    type: string
                    description: 정보 수정 일시 ISO 8601 형식
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
    put:
      operationId: ChannelModify
      summary: 채널 수정
      description: Classic/VPC 환경에서 이용 가능합니다.
      tags:
        - ncloud-chat

      x-ncloud-source: https://api.ncloud-docs.com/docs/bizapp-ncloudchat-channelmodify
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
          description: 채널 아이디 채널 목록 조회 참조
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: 채널 이름
        - name: uniqueId
          in: query
          required: false
          schema:
            type: string
          description: 채널 고유 아이디 고유 식별 용도로 사용자가 입력하는 아이디
        - name: type
          in: query
          required: false
          schema:
            type: string
          description: '채널 유형 PUBLIC | PRIVATE PUBLIC : 공개 PRIVATE : 비공개'
        - name: translation
          in: query
