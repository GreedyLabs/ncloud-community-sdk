          required: false
          schema:
            type: boolean
          description: '비활성화 여부 true | false true : 비활성화 false : 활성화'
        - name: mutes
          in: query
          required: false
          schema:
            type: boolean
          description: '음소거 여부 true | false true : 음소거 false : 음소거 안 함'
        - name: push
          in: query
          required: false
          schema:
