        - name: count
          in: query
          required: false
          schema:
            type: boolean
          description: '목록 대신 응답 결과 수 표시 여부 true | false true : 응답 결과 수 표시 false : 목록 표시'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: 구독 고유 아이디
                  project_id:
                    type: string
                    description: 프로젝트 아이디
                  channel_id:
                    type: string
                    description: 채널 아이디
                  user_id:
                    type: string
                    description: 사용자 아이디
                  online:
                    type: boolean
                    description: '온라인 여부 true | false true : 온라인 false : 오프라인'
                  language:
                    type: string
                    description: 접속 언어
                  push:
                    type: boolean
                    description: '푸시 알림 허용 여부 true | false true : 허용 false : 차단'
                  mute:
                    type: boolean
                    description: '채널 음소거 여부 true | false true : 음소거 false : 음소거 안 함'
                  user:
                    type: object
                    additionalProperties: true
                    description: 사용자 정보
                  mark:
                    type: object
                    additionalProperties: true
                    description: 마지막 메시지 정보
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
