openapi: 3.0.3
info:
  title: OCR
  description: OCR
  version: 1.0.0
  x-ncloud-availability:
    public: true
    financial: true
    gov: true

  x-ncloud-nrn:

    productName: OCR
    resource_types:
      - Domain

servers:
  - url: https://ocr.apigw.ntruss.com
    description: ocr 민간
    x-ncloud-env: public
  - url: https://ocr.apigw.fin-ntruss.com
    description: ocr 금융
    x-ncloud-env: financial
  - url: https://ocr.apigw.gov-ntruss.com
    description: ocr 공공
    x-ncloud-env: gov
security:
  # CLOVA OCR uses a per-app secret header AND lives on a per-customer
  # subdomain (the example host in docs is just one tenant's deployment).
  - ocrSecret: []
paths:
  /biz-license:
    post:
      operationId: OcrDocumentOcrBizlicense
      summary: 사업자등록증
      description: Classic/VPC 환경에서 이용 가능합니다.
      tags:
        - ocr

      x-ncloud-source: https://api.ncloud-docs.com/docs/ai-application-service-ocr-ocrdocumentocr-bizlicense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - version
                - requestId
                - timestamp
                - images
                - message
                - file
                - format
                - name
                - data
              properties:
                version:
                  type: string
                  description: 버전 정보 V2 만 사용
                requestId:
                  type: string
                  description: 임의의 API 호출 UUID
                timestamp:
                  type: integer
                  description: 임의의 API 호출 시각(밀리초) Unix Timestamp 형식
                images:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                  description: 'images 세부 정보: images'
                message:
                  type: object
                  additionalProperties: true
                  description: 요청 데이터 정보
                file:
                  type: string
                  description: OCR 인식 이미지 파일
                format:
                  type: string
                  description: '이미지 형식 jpg | jpeg | png | pdf | tif | tiff 이미지: jpg , jpeg , png 단일 페이지: pdf , tif , tiff 이미지 형식 중 하나를 선택하여 입력'
                name:
                  type: string
                  description: 임의의 이미지 이름 이미지 식별 및 응답 결과 확인 시 사용
                data:
                  type: string
                  description: 'Base64 인코딩된 이미지 데이터 Content-Type: application/json 일 때 입력 가능'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                    description: 버전 정보 V2 만 사용
                  requestId:
                    type: string
                    description: API 호출 UUID
                  timestamp:
                    type: integer
                    description: API 호출 시각(밀리초) Unix Timestamp 형식
                  images:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                    description: 'images 세부 정보: images'
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
