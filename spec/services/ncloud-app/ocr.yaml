  /general:
    post:
      operationId: Ocr
      summary: General OCR
      description: Classic/VPC 환경에서 이용 가능합니다.
      tags:
        - ocr

      x-ncloud-source: https://api.ncloud-docs.com/docs/ai-application-service-ocr-ocr
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - version
                - requestId
                - timestamp
                - images
                - file
                - message
                - format
                - name
              properties:
                version:
                  type: string
                  description: '버전 정보 V1 | V2 (권장) V1 : V1 엔진 호출 V2 : V2 엔진 호출'
                requestId:
                  type: string
                  description: 임의의 API 호출 UUID
                timestamp:
                  type: integer
                  description: 임의의 API 호출 시각(밀리초) Unix Timestamp 형식
                lang:
                  type: string
                  description: 'OCR 인식 요청 언어 정보 ko | ja | zh-TW ko : 한국어 ja : 일본어 zh-TW : 중국어(번체) 미입력 시 도메인의 언어 설정값으로 자동 설정 콤마(,)를 통해 여러 언어 동시 호출 가능 <예시> "ko, ja, zh-TW"'
                images:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                  description: 'images 세부 정보: images JSON Array로 작성 호출당 1개의 이미지 Array 작성 가능 이미지 크기: 최대 50 MB'
                enableTableDetection:
                  type: boolean
                  description: "문서 이미지 내 표(Table) 영역 인식 및 구조화된 형태 제공 여부 true | false (기본값) true : 표 인식 및 형태 제공 false : 표 미인식 및 형태 미제공 네이버 클라우드 플랫폼에 생성한 Domain에서 '표 추출 여부' 토글 버튼을 활성화(ON)해야 사용 가능"
                file:
                  type: string
                  description: OCR 인식 이미지 파일
                message:
                  type: object
                  additionalProperties: true
                  description: 요청 데이터 정보
                format:
                  type: string
                  description: '이미지 형식 jpg | jpeg | png | pdf | tif | tiff pdf : 최대 10 페이지 인식 가능'
                name:
                  type: string
                  description: 이미지 이름 이미지 식별 및 응답 결과 확인 시 사용
                url:
                  type: string
                  description: 이미지 URL 주소 이미지를 불러올 수 있는 공개된 URL images.url 또는 images.data 중 하나 필수 입력 둘 다 입력 시 images.data 우선
                data:
                  type: string
                  description: Base64 인코딩된 이미지 데이터 images.url 또는 images.data 중 하나 필수 입력 둘 다 입력 시 images.data 우선
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                    description: '버전 정보 V1 | V2 V1 : V1 엔진 호출 V2 : V2 엔진 호출'
                  requestId:
                    type: string
                    description: API 호출 UUID
                  timestamp:
                    type: integer
                    description: API 호출 시각(Timestamp)
                  images:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                    description: 'images 세부 정보: images'
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
