      parameters:
        - name: media
          in: query
          required: true
          schema:
            type: string
          description: '로컬 오디오/비디오 파일 지원 파일 형식 오디오: MP3 , AAC , AC3 , OGG , FLAC , WAV , M4A 비디오: AVI , MP4 , MOV , WMV , FLV , MKV'
        - name: params
          in: query
          required: true
          schema:
            type: object
            additionalProperties: true
          description: 파라미터 세부 정보
        - name: sed
          in: query
          required: false
          schema:
            type: object
            additionalProperties: true
          description: 이벤트 탐지 결과 세부 정보
        - name: format
          in: query
          required: false
          schema:
            type: string
          description: 응답 결과 반환 형식 JSON (기본값) | SRT | SMI
        - name: words
          in: query
          required: false
          schema:
            type: string
          description: 키워드 부스팅할 단어 목록
        - name: weight
          in: query
          required: false
          schema:
            type: string
          description: 키워드 부스팅 가중치
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: 응답 코드
                  message:
                    type: string
                    description: 응답 메시지
                  token:
                    type: string
                    description: 결과 토큰
                  version:
                    type: string
                    description: 엔진 버전
                  params:
                    type: object
                    additionalProperties: true
                    description: 파라미터 세부 정보
                  progress:
                    type: integer
                    description: 인식 진행률
                  keywords:
                    type: object
                    additionalProperties: true
                    description: 키워드 부스팅된 단어 목록
                  segments:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                    description: 'segments 세부 정보: segments'
                  text:
                    type: string
                    description: 전체 텍스트
                  confidence:
                    type: number
                    description: 전체 정확도
                  speakers:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                    description: '전체 화자 세부 정보: speakers'
                  events:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                    description: '이벤트 세부 정보: events'
                  eventTypes:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                    description: '인식된 모든 이벤트 세부 정보: eventTypes'
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
  /recognizer/url:
    post:
      operationId: LongSentenceExternalUrl
      summary: 외부 파일 인식
      description: Classic/VPC 환경에서 이용 가능합니다.
