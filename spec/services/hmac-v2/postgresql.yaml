components:
  schemas:
    AddCloudPostgresqlDatabaseListRequest:
      type: object
      properties:
        regionCode:
          type: string
          description: REGION 코드
        cloudPostgresqlInstanceNo:
          type: string
          description: CloudPostgresql 인스턴스 번호
        cloudPostgresqlDatabaseList:
          type: array
          description: CloudPostgresqlDatabase 리스트
          items:
            $ref: '#/components/schemas/CloudPostgresqlDatabaseParameter'
      required:
        - cloudPostgresqlDatabaseList
    AddCloudPostgresqlDatabaseListResponse:
      type: object
      properties:
        requestId:
          type: string
        returnCode:
          type: string
        returnMessage:
          type: string
    AddCloudPostgresqlUserListRequest:
      type: object
      properties:
        regionCode:
          type: string
          description: REGION 코드
        cloudPostgresqlInstanceNo:
          type: string
          description: CloudPostgresql 인스턴스 번호
        cloudPostgresqlUserList:
          type: array
          description: CloudPostgresqlDBUser 리스트
          items:
            $ref: '#/components/schemas/CloudPostgresqlUserParameter'
      required:
        - cloudPostgresqlUserList
    AddCloudPostgresqlUserListResponse:
      type: object
      properties:
        requestId:
          type: string
        returnCode:
          type: string
        returnMessage:
          type: string
    ChangeCloudPostgresqlUserListRequest:
