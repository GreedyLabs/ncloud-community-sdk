      properties:
        regionCode:
          type: string
          description: REGION 코드
        cloudPostgresqlInstanceNo:
          type: string
          description: CloudPostgresql 인스턴스 번호
        cloudPostgresqlUserList:
          type: array
          description: CloudPostgresqlDBUser 리스트
          items:
            $ref: '#/components/schemas/CloudPostgresqlUserParameter'
      required:
        - cloudPostgresqlUserList
    ChangeCloudPostgresqlUserListResponse:
      type: object
      properties:
        requestId:
          type: string
        returnCode:
          type: string
        returnMessage:
          type: string
    CloudPostgresqlBackup:
      type: object
      properties:
        cloudPostgresqlInstanceNo:
          type: string
          description: CloudPostgresql 인스턴스 번호
        cloudPostgresqlServiceName:
          type: string
          description: CloudPostgresql 서비스이름
