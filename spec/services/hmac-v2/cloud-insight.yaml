          description: 조회하려는 Event ID
        query:
          type: string
          description: Rule 이름, Metric 이름, Resource 이름으로 검색 가능
        startTime:
          type: integer
          format: int64
          description: 조회 시작 시간(밀리초)
        endTime:
          type: integer
          format: int64
          description: 조회 종료 시간(밀리초)
        pageSize:
          type: integer
          format: int32
          description: 페이지 크기 20 (기본값)
        pageNum:
          type: integer
          format: int32
          description: 페이지 번호 1 (기본값)
        onlyFetchUnCloseEvent:
          type: boolean
          description: true | false (기본값)
      required:
        - ruleId
        - eventId
        - startTime
        - endTime
    PMCreateUpdateDto:
