openapi: 3.0.3
info:
  title: cloud-insight
  description: cloud-insight
  version: 1.0.0
  x-ncloud-availability:
    public: true
    financial: true
    gov: true

  x-ncloud-nrn:

    productName: CloudInsight
    resource_types:
      - Dashboard
      - EventRule
      - PM
      - MetricExport

servers:
  - url: https://cw.apigw.ntruss.com
    description: cloud-insight 민간
    x-ncloud-env: public
  - url: https://cw.apigw.fin-ntruss.com
    description: cloud-insight 금융
    x-ncloud-env: financial
  - url: https://cw.apigw.gov-ntruss.com
    description: cloud-insight 공공
    x-ncloud-env: gov
security:
  - ncpAccessKey: []
    ncpTimestamp: []
    ncpHmacV2: []
paths:
  /cw_collector/real/data:
    post:
      operationId: SendData
      summary: SendData
      description: Classic/VPC 환경에서 이용 가능합니다.
      tags:
        - cloud-insight

      x-ncloud-source: https://api.ncloud-docs.com/docs/management-cloudinsight-senddata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - cw_key
                - data
              properties:
                cw_key:
                  type: string
                  description: 상품 키(cw_key) Cloud Insight 지표 참조
                data:
                  type: string
                  description: JSON 데이터 미리 정의한 데이터 입력 데이터는 {key}:{value} 형태로 입력
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: 응답 결과 메시지
                  dataId:
                    type: integer
                    description: 전송 데이터 아이디
                  message:
                    type: string
                    description: 전송 데이터 설명
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
  /cw_fea/real/cw/api/chart/dashboard:
    get:
      operationId: GetDashboardList
      summary: GetDashboardList
      description: Classic/VPC 환경에서 이용 가능합니다.
      tags:
        - cloud-insight

      x-ncloud-source: https://api.ncloud-docs.com/docs/management-cloudinsight-getdashboardlist
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                description: |
                  Top-level array of dashboards. Verified against the live
                  NCP API on 2026-04-26.
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: 대시보드 아이디
                    name:
                      type: string
                      description: 대시보드 이름
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
  /cw_fea/real/cw/api/chart/dashboard/{dashboardId}/widgets:
    get:
      operationId: GetDashboardWidgetList
      summary: GetDashboardWidgetList
      description: Classic/VPC 환경에서 이용 가능합니다.
      tags:
        - cloud-insight

      x-ncloud-source: https://api.ncloud-docs.com/docs/management-cloudinsight-getdashboardwidgetlist
      parameters:
        - name: dashboardId
          in: path
          required: true
          schema:
            type: string
          description: 대시보드 아이디 GetDashboardList 참조
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  dashboardId:
                    type: string
                    description: 대시보드 아이디
                  name:
                    type: string
                    description: 대시보드 이름
                  widgetId:
                    type: string
                    description: 위젯 아이디
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
  /cw_fea/real/cw/api/chart/dashboard/{dashboardId}/widgets/{widgetId}:
    get:
      operationId: GetDashboardWidgetImage
      summary: GetDashboardWidgetImage
      description: Classic/VPC 환경에서 이용 가능합니다.
      tags:
        - cloud-insight

      x-ncloud-source: https://api.ncloud-docs.com/docs/management-cloudinsight-getdashboardwidgetimage
      parameters:
        - name: dashboardId
          in: path
          required: true
          schema:
            type: string
          description: 대시보드 아이디 GetDashboardList 참조
        - name: widgetId
          in: path
          required: true
          schema:
            type: string
          description: 위젯 아이디 GetDashboardWidgetList 참조
        - name: startTime
          in: query
          required: true
          schema:
            type: integer
          description: 측정 시작 일시(밀리초) Unix Timestamp 형식
        - name: endTime
          in: query
          required: true
          schema:
            type: integer
          description: 측정 종료 일시(밀리초) Unix Timestamp 형식
        - name: widgetResolutionMode
          in: query
          required: false
          schema:
            type: string
          description: '조회 주기 AUTO (기본값) | HIGH AUTO : 대시보드와 동일한 주기로 조회 HIGH : 대시보드보다 짧은 주기로 상세 조회'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
  /cw_fea/real/cw/api/custom/resource:
    post:
      operationId: CreateCustomResource
      summary: CreateCustomResource
      description: Classic/VPC 환경에서 이용 가능합니다.
      tags:
        - cloud-insight

      x-ncloud-source: https://api.ncloud-docs.com/docs/management-cloudinsight-createcustomresource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - resourceName
                - resourceData
              properties:
                resourceId:
                  type: string
                  description: 사용자 리소스 아이디 입력한 아이디로 생성 미 입력 시 자동 생성 중복 불가
                resourceName:
                  type: string
                  description: 사용자 리소스 이름
                resourceTypeId:
                  type: string
                  description: 사용자 리소스 유형 아이디 resourceData 데이터 타입 인증을 위해 사용되는 값 정의한 데이터 타입의 resourceData 전송 가능 DEFAULT (기본값)
                resourceData:
                  type: object
                  additionalProperties: true
                  description: 사용자 리소스 데이터 resourceTypeId 에서 정의한 데이터 타입의 데이터 입력 resourceTypeId 에서 정의한 데이터 타입에 일치하는 필드만 저장
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resourceId:
                    type: string
                    description: 사용자 리소스 아이디
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
  /cw_fea/real/cw/api/custom/resource/list:
    get:
      operationId: GetAllCustomResource
      summary: GetAllCustomResource
      description: Classic/VPC 환경에서 이용 가능합니다.
      tags:
        - cloud-insight

      x-ncloud-source: https://api.ncloud-docs.com/docs/management-cloudinsight-getallcustomresource
      parameters:
        - name: resourceTypeId
          in: query
          required: false
          schema:
            type: string
          description: 사용자 리소스 유형 아이디 resourceData 데이터 타입 인증을 위해 사용되는 값 정의한 데이터 타입의 사용자 리소스만 조회 DEFAULT (기본값)
        - name: query
          in: query
          required: false
          schema:
            type: string
          description: 조회 키워드 resourceTypeId 에서 정의한 데이터 타입의 사용자 리소스만 조회
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resourceData:
                    type: object
                    additionalProperties: true
                    description: 사용자 리소스 데이터
                  resourceId:
                    type: string
                    description: 사용자 리소스 아이디
                  resourceName:
                    type: string
                    description: 사용자 리소스 이름
                  resourceTypeId:
                    type: string
                    description: 사용자 리소스 유형 아이디
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
  /cw_fea/real/cw/api/custom/resource/{resourceId}:
    get:
      operationId: GetCustomResource
      summary: GetCustomResource
      description: Classic/VPC 환경에서 이용 가능합니다.
      tags:
        - cloud-insight

      x-ncloud-source: https://api.ncloud-docs.com/docs/management-cloudinsight-getcustomresource
      parameters:
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
          description: 사용자 리소스 아이디 GetAllCustomResource 참조
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resourceData:
                    type: object
                    additionalProperties: true
                    description: 사용자 리소스 데이터
                  resourceId:
                    type: string
                    description: 사용자 리소스 아이디
                  resourceName:
                    type: string
                    description: 사용자 리소스 이름
                  resourceTypeId:
                    type: string
                    description: 사용자 리소스 유형 아이디 resourceData 데이터 타입 인증을 위해 사용되는 값 정의한 데이터 타입의 사용자 리소스만 조회 DEFAULT (기본값)
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
    put:
      operationId: UpdateCustomResource
      summary: UpdateCustomResource
      description: Classic/VPC 환경에서 이용 가능합니다.
      tags:
        - cloud-insight

      x-ncloud-source: https://api.ncloud-docs.com/docs/management-cloudinsight-updatecustomresource
      parameters:
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
          description: 사용자 리소스 아이디 GetCustomResource 참조
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - resourceData
                - resourceName
              properties:
                resourceData:
                  type: object
                  additionalProperties: true
                  description: 사용자 리소스 데이터 resourceTypeId 에서 정의한 데이터 타입의 데이터 입력 resourceTypeId 에서 정의한 데이터 타입에 일치하는 필드만 저장
                resourceName:
                  type: string
                  description: 사용자 리소스 이름
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
    delete:
      operationId: DeleteCustomResource
      summary: DeleteCustomResource
      description: Classic/VPC 환경에서 이용 가능합니다.
      tags:
        - cloud-insight

      x-ncloud-source: https://api.ncloud-docs.com/docs/management-cloudinsight-deletecustomresource
      parameters:
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
          description: 사용자 리소스 아이디 GetAllCustomResource 참조
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
  /cw_fea/real/cw/api/data/chart/preview:
    post:
      operationId: QueryWidgetDataPreView
      summary: QueryWidgetDataPreview
      description: Classic/VPC 환경에서 이용 가능합니다.
      tags:
        - cloud-insight

      x-ncloud-source: https://api.ncloud-docs.com/docs/management-cloudinsight-querywidgetdatapreview
      requestBody:
        required: true
        description: See https://api.ncloud-docs.com/docs/common-vapidatatype-cichartdatawidgetdto
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChartDataWidgetDto'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  color:
                    type: string
                    description: 차트 색
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                    description: 조회 결과 데이터 포인트(Unix Timestamp 형식), 데이터 값 형태로 표시
                  dimensions:
                    type: object
                    additionalProperties: true
                    description: Dimension 정보
                  displayName:
                    type: string
                    description: 위젯에 노출되는 Metric 이름
                  idDimension:
                    type: string
                    description: Dimension 이름
                  metric:
                    type: string
                    description: Metric 이름
                  period:
                    type: string
                    description: 집계 주기 Min1 | Min5 | Min30 | Hour2 | Day1
                  prodKey:
                    type: string
                    description: 상품 키(cw_key) Cloud Insight 지표 참조
                  prodName:
                    type: string
                    description: 상품 이름 Cloud Insight 지표 참조
                  resourceName:
                    type: string
                    description: 리소스 이름
                  statistic:
                    type: string
                    description: 집계 함수 COUNT | SUM | MAX | MIN | AVG
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
  /cw_fea/real/cw/api/data/query:
    post:
      operationId: QueryData
      summary: QueryData
      description: Classic/VPC 환경에서 이용 가능합니다.
      tags:
        - cloud-insight

      x-ncloud-source: https://api.ncloud-docs.com/docs/management-cloudinsight-querydata
      requestBody:
        required: true
        description: See https://api.ncloud-docs.com/docs/common-vapidatatype-cidataqueryrequest
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataQueryRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                    description: 조회 결과 데이터 포인트(Unix Timestamp 형식), 데이터 값 형태로 표시
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
  /cw_fea/real/cw/api/data/query/multiple:
    post:
      operationId: QueryDataMultiPle
      summary: QueryDataMultiple
      description: Classic/VPC 환경에서 이용 가능합니다.
      tags:
        - cloud-insight

      x-ncloud-source: https://api.ncloud-docs.com/docs/management-cloudinsight-querydatamultiple
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - timeStart
                - timeEnd
                - metricInfoList
              properties:
                timeStart:
                  type: integer
                  description: 조회 시작 일시(밀리초) Unix Timestamp 형식
                timeEnd:
                  type: integer
                  description: 조회 종료 일시(밀리초) Unix Timestamp 형식
                metricInfoList:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                  description: 조회 조건 1회 호출에 최대 20개의 조건 조회 가능
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  aggregation:
                    type: string
                    description: 집계 함수 COUNT | SUM | MAX | MIN | AVG
                  dimensions:
                    type: object
                    additionalProperties: true
                    description: Dimension 정보
                  dps:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                    description: 조회 결과 데이터 포인트(Unix Timestamp 형식), 데이터 값 형태로 표시
                  interval:
                    type: string
                    description: 집계 주기 Min1 | Min5 | Min30 | Hour2 | Day1
                  metric:
                    type: string
                    description: Metric 이름
                  productName:
                    type: string
                    description: 상품 이름 Cloud Insight 지표 참조
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
  /cw_fea/real/cw/api/event/search:
    post:
      operationId: SearchEvent
      summary: SearchEvent
      description: Classic/VPC 환경에서 이용 가능합니다.
      tags:
        - cloud-insight

      x-ncloud-source: https://api.ncloud-docs.com/docs/management-cloudinsight-searchevent
      requestBody:
        required: true
        description: See https://api.ncloud-docs.com/docs/common-vapidatatype-cieventsearchrequest
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventSearchRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                    description: 'Event 정보: events'
                  pageNum:
                    type: integer
                    description: 페이지 번호
                  pageSize:
                    type: integer
                    description: 페이지 출력 수
                  totalRecords:
                    type: integer
                    description: 응답 결과 수
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
  /cw_fea/real/cw/api/event/searchById:
    post:
      operationId: SearchEventById
      summary: SearchEventById
      description: Classic/VPC 환경에서 이용 가능합니다.
      tags:
        - cloud-insight

      x-ncloud-source: https://api.ncloud-docs.com/docs/management-cloudinsight-searcheventbyid
      requestBody:
        required: true
        description: See https://api.ncloud-docs.com/docs/common-vapidatatype-cieventsearchrequestbyid
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventSearchRequestById'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  detectValue:
                    type: string
                    description: Event 값
                  inMaintenance:
                    type: boolean
                    description: '유지 보수 설정 여부 true | false true : 설정 false : 설정 해제'
                  prodKey:
                    type: string
                    description: 상품 키(cw_key) Cloud Insight 지표 참조
                  criteria:
                    type: string
                    description: Event Rule 값
                  cycles:
                    type: integer
                    description: 'Event 종료 상태 Event 발생 리소스가 삭제되어 Event가 종료 처리됐는지 확인하는 값 0 : 종료 안 됨 (기본값) 1 : 종료'
                  metricGroupItemId:
                    type: string
                    description: Metric Group 항목 아이디
                  operator:
                    type: string
                    description: Event 발생 조건을 평가하기 위한 비교 연산자 LT | LE | EQ | GE | NE | EXP
                  regionCode:
                    type: string
                    description: 리전 코드
                  eventLevel:
                    type: string
                    description: Event 레벨 INFO | WARNING | CRITICAL
                  calcSlidingGroupKey:
                    type: string
                    description: Event 상세 정보
                  ruleName:
                    type: string
                    description: Event Rule 이름
                  startTime:
                    type: integer
                    description: 조회 시작 일시(밀리초) Unix Timestamp 형식
                  ruleId:
                    type: integer
                    description: Event Rule 아이디
                  eventId:
                    type: string
                    description: Event 아이디
                  notificationGroups:
                    type: string
                    description: 통보 대상 그룹 이름
                  unit:
                    type: string
                    description: Event 단위
                  metric:
                    type: string
                    description: Metric 이름
                  eventCause:
                    type: string
                    description: Event 발생 원인
                  plannedMaintains:
                    type: string
                    description: 유지 보수 일정
                  interval:
                    type: string
                    description: 집계 주기 Min1 | Min5 | Min30 | Hour2 | Day1
                  calc:
                    type: string
                    description: 집계 함수 COUNT | AVG | SUM | MAX | MIN
                  describe:
                    type: string
                    description: Event Rule 설명
                  endTime:
                    type: integer
                    description: 조회 종료 일시(밀리초) Unix Timestamp 형식
                  zoneCode:
                    type: string
                    description: 존 코드
                  dimensions:
                    type: object
                    additionalProperties: true
                    description: Dimensions 정보
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
  /cw_fea/real/cw/api/event/searchEventCountConsole:
    post:
      operationId: SearchEventCountConsole
      summary: SearchEventCountConsole
      description: Classic/VPC 환경에서 이용 가능합니다.
