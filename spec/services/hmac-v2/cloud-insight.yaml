          additionalProperties: true
          description: 'Dimension을 JSON으로 명시 key: cw_key <예시> 460438474722512896 value: 리소스 Dimension 목록 cw_key 는 dimensions 객체의 key로 사용됨 <예시> {"dimensions": "123456": [{ "instanceNo": "1111", "type": "svr" }]} 위 예시에서 "12345'
