components:
  securitySchemes:
    ncpHmacV2:
      type: apiKey
      in: header
      name: x-ncp-apigw-signature-v2
    ncpAccessKey:
      type: apiKey
      in: header
      name: x-ncp-iam-access-key
    ncpTimestamp:
      type: apiKey
      in: header
      name: x-ncp-apigw-timestamp
  schemas:
    SuccessResponse:
      type: object
      description: Trivial success envelope — returned by mutations that don't carry a body.
      required:
        - success
      properties:
        success:
          type: boolean
          description: API 호출 성공 여부
    NcloudErrorEnvelope:
      type: object
      description: 'Naver Cloud Platform standard error envelope. Most products return this shape; some (Object Storage, CLOVA) wrap differently — `additionalProperties: true` keeps clients tolerant.'
      properties:
        responseError:
          type: object
          description: 'Error detail (present on most NCP product errors). Field shape varies; `additionalProperties: true` keeps clients tolerant.'
          properties:
            returnCode:
              type: string
              description: NCP error code.
            returnMessage:
              type: string
              description: Human-readable error message.
          additionalProperties: true
        error:
          description: 'Alternative error field. Type varies: object (CLOVA, NCP standard), string (cert-manager Spring Boot 404), or null.'
      additionalProperties: true
    ChartDataWidgetDto:
      type: object
      description: 'Cloud Insight DTO. Source: https://api.ncloud-docs.com/docs/common-vapidatatype-cichartdatawidgetdto'
      properties:
        periodStart:
          type: integer
          format: int64
          description: 조회 시작 시간(밀리초) 현재 시간으로부터 1시간 이전(기본값)
        periodEnd:
          type: integer
          format: int64
          description: 조회 종료 시간(밀리초) 현재 시간(기본값)
        metricsInfo:
          type: array
          items:
            $ref: '#/components/schemas/WidgetMetricInfoDto'
          description: 데이터 조회를 위한 Metric 정보
      required:
        - periodStart
        - periodEnd
        - metricsInfo
    DataQueryRequest:
      type: object
      description: 'Cloud Insight DTO. Source: https://api.ncloud-docs.com/docs/common-vapidatatype-cidataqueryrequest'
      properties:
        timeStart:
          type: integer
          format: int64
          description: 조회 시작 시간(밀리초)
        timeEnd:
          type: integer
          format: int64
          description: 조회 종료 시간(밀리초)
        productName:
          type: string
          description: 상품명
        cw_key:
          type: string
          description: 상품의 cw_key
        metric:
          type: string
          description: 조회하려는 Metric 이름
        interval:
          allOf:
            - $ref: '#/components/schemas/Interval'
          description: 조회하려는 데이터의 집계 주기 Min1 (기본값) | Min5 | Min30 | Hour2 | Day1
        aggregation:
          allOf:
            - $ref: '#/components/schemas/Calculation'
          description: 조회하려는 데이터의 집계 함수 COUNT | SUM | MAX | MIN | AVG (기본값)
        queryAggregation:
          allOf:
            - $ref: '#/components/schemas/QueryAggregation'
          description: 쿼리 기준이 충분하지 않을 때 쿼리 결과를 처리하는 방법 COUNT | SUM | MAX | MIN | AVG (기본값)
        dimensions:
          type: object
          additionalProperties: true
          description: 조회하려는 Dimension을 JSON으로 명시
      required:
        - timeStart
        - timeEnd
        - cw_key
        - metric
        - dimensions
    EventSearchRequest:
      type: object
      description: 'Cloud Insight DTO. Source: https://api.ncloud-docs.com/docs/common-vapidatatype-cieventsearchrequest'
      properties:
        ruleId:
          type: integer
          format: int64
          description: 조회하려는 Event Rule ID
        eventId:
          type: string
          description: 조회하려는 Event ID
        query:
          type: string
          description: Rule 이름, Metric 이름, Resource 이름으로 검색 가능
        startTime:
          type: integer
          format: int64
          description: 조회 시작 시간(밀리초)
        endTime:
          type: integer
          format: int64
          description: 조회 종료 시간(밀리초)
        pageSize:
          type: integer
          format: int32
          description: 페이지 크기 20 (기본값)
        pageNum:
          type: integer
          format: int32
          description: 페이지 번호 1 (기본값)
        onlyFetchUnCloseEvent:
          type: boolean
          description: true | false (기본값)
      required:
        - startTime
        - endTime
    EventSearchRequestById:
      type: object
      description: 'Cloud Insight DTO. Source: https://api.ncloud-docs.com/docs/common-vapidatatype-cieventsearchrequestbyid'
      properties:
