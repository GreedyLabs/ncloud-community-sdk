          application/json:
            schema:
              type: object
              required:
                - tagKey
                - tagValue
              properties:
                tagKey:
                  type: string
                  description: 태그 키 Application 태그 조회 참조
                tagValue:
                  type: string
                  description: 태그 값 Application 태그 조회 참조
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: API 처리 결과
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
  /assignments:
    get:
      operationId: GetAssignMents
      summary: Assignment 목록 조회
      description: Classic/VPC 환경에서 이용 가능합니다.
      tags:
        - sso

      x-ncloud-source: https://api.ncloud-docs.com/docs/get-assignments
      parameters:
        - name: searchWord
          in: query
          required: false
          schema:
            type: string
          description: 검색 키워드 assignmentName 과 전체 또는 부분 일치하지 않는 값을 입력한 경우, 응답 시 items 가 빈 값 [] 으로 표시 searchColumn 없이 요청하는 경우, 전체 목록 표시
