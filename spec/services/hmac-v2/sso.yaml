                    description: '권한 부여 방식 authorization_code | refresh_token | implicit authorization_code : 자체 생성한 Authorization code로 Access Token 발급 refresh_token : Access Token 만료 후 재로그인 없이 새 Access Token 발급 implicit : Authorization code없이 바로 Access Token 발급. 자격 증명을 안전하게 저장하기 힘든 Client 환경에 최적화 OAuth 2.0'
                  scopes:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                    description: 'Application 접근 가능 정보 범위 profile | openid | groups | email profile : 계정 구분, 로그인 아이디, 회원 고유 식별자, 사용자 이름 openid : 계정 구분, 로그인 아이디, 회원 고유 식별자, 사용자 이름 groups : 계정 구분, 로그인 아이디, 회원 고유 식별자, 사용자 이름, 그룹 email : 계정 구분, 로그인 아이디, 회원 고유 식별자, 사용자 이름, 이메일 OAuth 2.0'
                  accessTokenValidity:
                    type: number
                    description: Access Token 유효 기간(초) OAuth 2.0
                  refreshTokenValidity:
                    type: number
                    description: Refresh Token 유효 기간(초) OAuth 2.0
                  consentPage:
                    type: object
                    additionalProperties: true
                    description: 개인 정보 제공 동의 페이지 정보
                  protocol:
                    type: string
                    description: 'Application 프로토콜 OAUTH2 : OAuth 2.0 (유효 값)'
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
    put:
      operationId: PutApplication
      summary: Application 수정
      description: Classic/VPC 환경에서 이용 가능합니다.
      tags:
        - sso

      x-ncloud-source: https://api.ncloud-docs.com/docs/put-application
      parameters:
