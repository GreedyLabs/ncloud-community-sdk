openapi: 3.0.3
info:
  title: sso
  description: sso
  version: 1.0.0
  x-ncloud-availability:
    public: true
    financial: true
    gov: true

  x-ncloud-nrn:

    productName: SSO
    resource_types:
      - Application
      - Tenant
      - Customer
      - SubAccount

servers:
  # /api/v1 prefix verified against the live NCP API on 2026-04-26 — without
  # it the gateway returns errorCode 300 ("URL not found").
  - url: https://sso.apigw.ntruss.com/api/v1
    description: sso 민간
    x-ncloud-env: public
  - url: https://sso.apigw.fin-ntruss.com/api/v1
    description: sso 금융
    x-ncloud-env: financial
  - url: https://sso.apigw.gov-ntruss.com/api/v1
    description: sso 공공
    x-ncloud-env: gov
security:
  - ncpAccessKey: []
    ncpTimestamp: []
    ncpHmacV2: []
paths:
  /applications:
    get:
      operationId: GetApplications
      summary: Application 목록 조회
      description: Classic/VPC 환경에서 이용 가능합니다.
      tags:
        - sso

      x-ncloud-source: https://api.ncloud-docs.com/docs/get-applications
      parameters:
        - name: searchColumn
          in: query
          required: false
          schema:
            type: string
          description: '검색 컬럼 applicationId | applicationName applicationId : Application 아이디 applicationName : Application 이름'
        - name: searchWord
          in: query
          required: false
          schema:
            type: string
          description: 검색 키워드 검색 컬럼 옵션( applicationId , applicationName )과 전체 또는 부분 일치하지 않는 값을 입력한 경우, 응답 시 items 가 빈 값 [] 으로 표시 searchColumn 없이 요청하는 경우, 전체 목록 표시
        - name: page
          in: query
          required: false
          schema:
            type: integer
          description: '페이지 번호 0~N (기본값: 0)'
        - name: size
          in: query
          required: false
          schema:
            type: integer
          description: '페이지 출력 수 1~N (기본값: 20)'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  page:
                    type: number
                    description: 페이지 번호
                  totalPages:
                    type: number
                    description: 전체 페이지 수
                  totalItems:
                    type: number
                    description: 응답 결과 수
                  isFirst:
                    type: boolean
                    description: '첫 페이지 여부 true | false true : 첫 페이지 false : 첫 페이지 아님'
                  isLast:
                    type: boolean
                    description: '마지막 페이지 여부 true | false true : 마지막 페이지 false : 마지막 페이지 아님'
                  hasPrevious:
                    type: boolean
                    description: '이전 페이지 존재 여부 true | false true : 존재 false : 존재 안 함'
                  hasNext:
                    type: boolean
                    description: '다음 페이지 존재 여부 true | false true : 존재 false : 존재 안 함'
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                    description: 'Application 목록: items'
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
    post:
      operationId: PostApplication
      summary: Application 생성
      description: Classic/VPC 환경에서 이용 가능합니다.
      tags:
        - sso

      x-ncloud-source: https://api.ncloud-docs.com/docs/post-application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - mbrLoginAllow
                - redirectUris
                - clientAuthMethod
                - accessType
                - grantTypes
                - scopes
                - consentPage
                - protocol
              properties:
                name:
                  type: string
                  description: Application 이름 영문자, 숫자, 특수문자 '.', '-', '_'를 조합하여 2~100자 이내로 입력 문자열 시작은 영문자로 구성
                description:
                  type: string
                  description: Application 설명 0~500자
                applicationUrl:
                  type: string
                  description: Application URL
                applicationType:
                  type: string
                  description: 'Application 유형 web (기본값) | app web : 웹 app : 앱'
                mbrLoginAllow:
                  type: string
                  description: '메인 계정 로그인 허용 여부 ALLOW | DENY ALLOW : 허용 DENY : 거부'
                redirectUris:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                  description: Application 리디렉션 URI 목록 1~50개 입력 가능 OAuth 2.0
                clientAuthMethod:
                  type: string
                  description: 'Application 인증 방식 client_secret_basic | client_secret_post | none client_secret_basic : Client 자격 증명을 HTTP Basic 인증 헤더로 전달 client_secret_post : Client 아이디와 Secret을 POST 요청 본문에 포함 none : 인증 안 함 accessType 이 confidential 인 경우, client_secret_basic 또는 client_secret_post 입력 가능 accessType 이 public 인 경우, none 만 입력 가능 OAuth 2.0'
                accessType:
                  type: string
                  description: 'Application 접근 방식 confidential | public confidential : Client 아이디 및 Secret으로 인증 후 접근 public : Client 아이디로 인증 후 접근 OAuth 2.0'
                grantTypes:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                  description: '권한 부여 방식 authorization_code | refresh_token | implicit authorization_code : 자체 생성한 Authorization code로 Access Token 발급 refresh_token : Access Token 만료 후 재로그인 없이 새 Access Token 발급 implicit : Authorization Code 없이 바로 Access Token 발급. 자격 증명을 안전하게 저장하기 힘든 Client 환경에 최적화 authorization_code , implicit 중 하나는 필수 포함 OAuth 2.0'
                scopes:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                  description: 'Application 접근 가능 정보 범위 profile | openid | groups | email profile : 계정 구분, 로그인 아이디, 회원 고유 식별자, 사용자 이름 openid : 계정 구분, 로그인 아이디, 회원 고유 식별자, 사용자 이름 groups : 계정 구분, 로그인 아이디, 회원 고유 식별자, 사용자 이름, 그룹 email : 계정 구분, 로그인 아이디, 회원 고유 식별자, 사용자 이름, 이메일 profile , openid 중 하나는 필수 포함 OAuth 2.0'
                accessTokenValidity:
                  type: number
                  description: Access Token 유효 기간(초) 43200 (기본값) OAuth 2.0
                refreshTokenValidity:
                  type: number
                  description: Refresh Token 유효 기간(초) 2592000 (기본값) OAuth 2.0
                consentPage:
                  type: object
                  additionalProperties: true
                  description: 개인 정보 제공 동의 페이지 정보
                protocol:
                  type: string
                  description: 'Application 프로토콜 OAUTH2 : OAuth 2.0 (유효 값)'
                tags:
                  type: object
                  additionalProperties: true
                  description: "정책의 태그 리소스당 최대 20개 {tagKey}:{tagValue} 형식으로 입력 tagKey: 영문자, 숫자, 특수 문자 ' ', '.', '/', '=', '+', '-', '@'를 조합하여 128자 이내로 입력 tagValue: 영문자, 숫자, 특수 문자 ' ', '.', '/', '=', '+', '-', '@'를 조합하여 256자 이내로 입력"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  applicationId:
                    type: string
                    description: Application 아이디
                  oauth2:
                    type: object
                    additionalProperties: true
                    description: OAuth 2.0 정보
                  protocol:
                    type: string
                    description: 'Application 프로토콜 OAUTH2 : OAuth 2.0'
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
  /applications/{applicationId}:
    get:
      operationId: GetApplication
      summary: Application 조회
      description: Classic/VPC 환경에서 이용 가능합니다.
