                  clientAuthMethod:
                    type: string
                    description: 'Application 인증 방식 client_secret_basic | client_secret_post | none client_secret_basic : Client 자격 증명을 HTTP Basic 인증 헤더로 전달 client_secret_post : Client 아이디와 Secret을 POST 요청 본문에 포함 none : 인증 안 함 OAuth 2.0'
                  redirectUris:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                    description: Application 리디렉션 URI 목록 OAuth 2.0
                  accessType:
                    type: string
                    description: 'Application 접근 방식 confidential | public confidential : Client 아이디 및 Secret으로 인증 후 접근 public : Client 아이디로 인증 후 접근 OAuth 2.0'
                  grantTypes:
                    type: array
                    items:
                      type: object
