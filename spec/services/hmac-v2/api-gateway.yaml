                  description: 생성할 Authorizer의 구성 정보
                authorizerType:
                  type: string
                  description: Authorizer의 지원 서비스(유형) 선택
                authorizerDescription:
                  type: string
                  description: 생성할 Authorizer에 대한 설명 입력 0~300자
