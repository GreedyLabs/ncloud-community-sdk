                type:
                  type: string
                  description: "발생 이벤트 유형 ES010 | ES020 | EU400 | EU410 | EU420 ES010 : 구독 요청(Subscription Request) ES020 : 구독 상태 변경(Change Subscription's Status) EU400 : 사용량 초과(Exceeded Quota) EU410 : 초당 요청수 초과(Exceeded Throttle) EU420 : 초당 사용량 초과(Exceeded Rate) 컬렉션의 아이템은 null일 수 없음"
