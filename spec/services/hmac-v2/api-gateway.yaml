                    description: (inferred from JSON example)
                  level:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                    description: (inferred from JSON example)
                  limit:
                    type: integer
                    description: (inferred from JSON example)
                  timeZone:
                    type: string
                    description: (inferred from JSON example)
