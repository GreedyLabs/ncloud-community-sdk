  /api-keys/{api-key-id}/subscription-detail:
    get:
      operationId: ApikeySubScriptIonDetail
      summary: API Key 구독 조회
      description: Classic/VPC 환경에서 이용 가능합니다.
      tags:
        - api-gateway

      x-ncloud-source: https://api.ncloud-docs.com/docs/apigateway-apikey-subscription-detail
