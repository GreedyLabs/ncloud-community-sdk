openapi: 3.0.3
info:
  title: api-gateway
  description: api-gateway
  version: 1.0.0
  x-ncloud-availability:
    public: true
    financial: true
    gov: true

  x-ncloud-nrn:

    productName: APIGateway
    resource_types:
      - Product
      - API
      - APIKey
      - UsagePlan
      - Authorizer
      - Certificate

servers:
  - url: https://apigateway.apigw.ntruss.com
    description: api-gateway 민간
    x-ncloud-env: public
  - url: https://apigateway.apigw.fin-ntruss.com
    description: api-gateway 금융
    x-ncloud-env: financial
  - url: https://apigateway.apigw.gov-ntruss.com
    description: api-gateway 공공
    x-ncloud-env: gov
security:
  - ncpAccessKey: []
    ncpTimestamp: []
    ncpHmacV2: []
paths:
  /api-keys:
    get:
      operationId: ApikeyApikeys
      summary: API Key 목록 조회
      description: Classic/VPC 환경에서 이용 가능합니다.
      tags:
        - api-gateway

      x-ncloud-source: https://api.ncloud-docs.com/docs/apigateway-apikey-apikeys
      parameters:
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: 조회할 데이터 목록에서 시작할 위치 0~9,223,372,036,854,775,807
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: 한 번에 조회할 데이터 개수 1~9,223,372,036,854,775,807
        - name: apiKeyName
          in: query
          required: false
          schema:
            type: string
          description: API Key 이름으로 필터링 0~20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiKeys:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                    description: (inferred from JSON example)
                  total:
                    type: integer
                    description: (inferred from JSON example)
                  initialCount:
                    type: integer
                    description: (inferred from JSON example)
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
    post:
      operationId: ApikeyCreate
      summary: API Key 생성
      description: Classic/VPC 환경에서 이용 가능합니다.
      tags:
        - api-gateway

      x-ncloud-source: https://api.ncloud-docs.com/docs/apigateway-apikey-create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - apiName
              properties:
                apiKeyDescription:
                  type: string
                  description: 생성할 API Key에 대한 설명 0~50자
                apiName:
                  type: string
                  description: 생성할 API Key의 이름 1~20자
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiKeyDescription:
                    type: string
                    description: (inferred from JSON example)
                  apiKeyName:
                    type: string
                    description: (inferred from JSON example)
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
  /api-keys/search:
    post:
      operationId: ApikeyApikeysSearch
      summary: API Key 조회
      description: Classic/VPC 환경에서 이용 가능합니다.
      tags:
        - api-gateway

      x-ncloud-source: https://api.ncloud-docs.com/docs/apigateway-apikey-apikeys-search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - productId
              properties:
                offset:
                  type: integer
                  format: int64
                  description: 조회할 데이터 목록에서 시작할 위치 0~9,223,372,036,854,775,807
                limit:
                  type: integer
                  format: int64
                  description: 한 번에 조회할 데이터 개수 1~9,223,372,036,854,775,807
                productId:
                  type: integer
                  format: int64
                  description: API Key와 연결된 Product ID 1~10
                apiKeyName:
                  type: string
                  description: API Key 이름으로 필터링 0~20
                statusSet:
                  type: object
                  additionalProperties: true
                  description: 'Product에 연결된 API Key의 상태로 필터링 ACCEPTED | REJECTED | REQUEST | DENY | BLOCKED_REQUEST ACCEPTED : 승인 REJECTED : 거부 REQUEST : 요청 DENY : 요청 거부 BLOCKED_REQUEST : 요청 차단'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  offset:
                    type: integer
                    description: (inferred from JSON example)
                  limit:
                    type: integer
                    description: (inferred from JSON example)
                  productId:
                    type: string
                    description: (inferred from JSON example)
                  apiKeyName:
                    type: string
                    description: (inferred from JSON example)
                  statusSet:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                    description: (inferred from JSON example)
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
  /api-keys/{api-key-id}:
    get:
      operationId: ApikeyApikeysDetail
      summary: API Key 상세 조회
      description: Classic/VPC 환경에서 이용 가능합니다.
      tags:
        - api-gateway

      x-ncloud-source: https://api.ncloud-docs.com/docs/apigateway-apikey-apikeys-detail
      parameters:
        - name: api-key-id
          in: path
          required: true
          schema:
            type: string
          description: 조회할 API Key ID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiKeyId:
                    type: string
                    description: (inferred from JSON example)
                  tenantId:
                    type: string
                    description: (inferred from JSON example)
                  apiKeyName:
                    type: string
                    description: (inferred from JSON example)
                  apiKeyDescription:
                    type: string
                    description: (inferred from JSON example)
                  primaryKey:
                    type: string
                    description: (inferred from JSON example)
                  secondaryKey:
                    type: string
                    description: (inferred from JSON example)
                  modifier:
                    type: string
                    description: (inferred from JSON example)
                  isEnabled:
                    type: boolean
                    description: (inferred from JSON example)
                  modTime:
                    type: string
                    description: (inferred from JSON example)
                  domainCode:
                    type: string
                    description: (inferred from JSON example)
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
    put:
      operationId: ApikeyChange
      summary: API Key 수정
      description: Classic/VPC 환경에서 이용 가능합니다.
      tags:
        - api-gateway

      x-ncloud-source: https://api.ncloud-docs.com/docs/apigateway-apikey-change
      parameters:
        - name: api-key-id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - isEnabled
                - apiName
              properties:
                isEnabled:
                  type: boolean
                  description: 'API Key 활성 여부 true | false true : API Key 활성 false : API Key 비활성'
                apiKeyDescription:
                  type: string
                  description: API Key에 대한 설명 0~50자
                apiName:
                  type: string
                  description: API Key의 이름 1~20자
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  isEnabled:
                    type: boolean
                    description: (inferred from JSON example)
                  apiKeyDescription:
                    type: string
                    description: (inferred from JSON example)
                  apiKeyName:
                    type: string
                    description: (inferred from JSON example)
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
    patch:
      operationId: ApikeyRegenerate
      summary: API Key 재생성
      description: Classic/VPC 환경에서 이용 가능합니다.
      tags:
        - api-gateway

      x-ncloud-source: https://api.ncloud-docs.com/docs/apigateway-apikey-regenerate
      parameters:
        - name: api-key-id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - keyType
              properties:
                keyType:
                  type: string
                  description: '재생성할 API Key의 유형 PRIMARY | SECONDARY PRIMARY : Primary Key SECONDARY : Secondary Key'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  keyType:
                    type: string
                    description: (inferred from JSON example)
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
    delete:
      operationId: ApikeyDelete
      summary: API Key 삭제
      description: Classic/VPC 환경에서 이용 가능합니다.
      tags:
        - api-gateway

      x-ncloud-source: https://api.ncloud-docs.com/docs/apigateway-apikey-delete
      parameters:
        - name: api-key-id
          in: path
          required: true
          schema:
            type: string
          description: 삭제할 API Key ID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
