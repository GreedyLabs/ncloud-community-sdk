              schema:
                type: object
                properties:
                  apiKeyRelateProductDtos:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                    description: (inferred from JSON example)
                  total:
                    type: integer
                    description: (inferred from JSON example)
        4XX:
