                  type: integer
                  description: 앱 구동 시간(초) 300 ~ 604800, -1(영구)
                description:
                  type: string
                  description: 앱 설명 0~2048자
                dependentIds:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                  description: 앱 생성 시 필요한 의존 앱 아이디 목록 getAppBasicSetting 참조
                components:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                  description: 앱 구성 컴포넌트 getAppBasicSetting 참조 요청 바디는 AppComponentRequest 데이터 타입 참조
