              properties:
                accountId:
                  type: string
                  description: 계정 고유 식별자 0~22자 UUID를 Base62로 변환한 형식 Accounts의 getList 참조
                queueName:
                  type: string
                  description: YARN 큐 이름 longlived (기본값) 0~60자
                appTypeId:
                  type: string
                  description: 앱 타입 및 버전 0~60자 getAppTypeIdList 참조 <예시> DEV-1.0.0
                name:
                  type: string
                  description: 앱 이름 영문 소문자, 숫자, 특수문자 '-'를 조합하여 3~15자로 입력 문자열의 시작과 마지막은 영문 소문자 또는 숫자로 구성 특수문자 '-' 연속 사용 불가
