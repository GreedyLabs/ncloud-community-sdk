        - data-forest

      x-ncloud-source: https://api.ncloud-docs.com/docs/analytics-dataforest-accounts-checkavailablename
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: 계정 이름 영문 소문자, 숫자, 특수문자 '-'를 조합하여 2~16자로 입력 문자열의 시작과 마지막은 영문 소문자 또는 숫자로 구성
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: 'API 처리 결과 true | false true : 성공 false : 실패'
                  message:
                    type: string
                    description: 결과 메시지 success 또는 availableName 이 false 인 경우, 표시
                  availableName:
                    type: string
                    description: '계정 이름의 유효성 여부 true | false true : 유효함 false : 유효하지 않음'
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
