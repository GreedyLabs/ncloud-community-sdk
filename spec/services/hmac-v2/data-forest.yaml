openapi: 3.0.3
info:
  title: Data Forest
  description: Data Forest
  version: 1.0.0
  x-ncloud-availability:
    public: true
    financial: false
    gov: false

  x-ncloud-nrn:

    productName: DataForest
    resource_types:
      - Account
      - App

servers:
  - url: https://df.apigw.ntruss.com
