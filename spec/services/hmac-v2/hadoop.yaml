openapi: 3.0.3
info:
  title: hadoop
  description: ''
  version: 1.0.0
  x-ncloud-availability:
    public: true
    financial: false
    gov: true

  x-ncloud-nrn:

    productName: VPCCloudHadoop
    resource_types:
      - Cluster
      - Server
      - Notebook

servers:
  - url: https://ncloud.apigw.ntruss.com/vhadoop/v2
    description: hadoop 민간
    x-ncloud-env: public
  - url: https://ncloud.apigw.gov-ntruss.com/vhadoop/v2
    description: hadoop 공공
    x-ncloud-env: gov
security:
  - ncpAccessKey: []
    ncpTimestamp: []
    ncpHmacV2: []
paths:
  /backupClusterConfiguration:
