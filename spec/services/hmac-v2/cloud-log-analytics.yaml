  /api/{regionCode}-v1/classic/servers/collecting-infos:
    post:
      operationId: ChangeServerLogSetTingClassicServer
      summary: 서버 로그 수집 설정
      description: Classic 환경에서 이용 가능합니다.
      tags:
        - cloud-log-analytics

      x-ncloud-source: https://api.ncloud-docs.com/docs/analytics-cloudloganalytics-changeserverlogsetting-classic-server
      parameters:
        - name: regionCode
          in: path
          required: true
          schema:
            type: string
          description: '리전 코드 kr | sgn | jpn | uswn | den kr : 한국 리전 sgn : 싱가포르 리전 jpn : 일본 리전 uswn : 미국 서부 리전 den : 독일 리전'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - collectingInfos
                - logPath
                - logTemplate
                - logType
                - servername
                - osType
                - instanceNo
                - ip
              properties:
                collectingInfos:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                  description: '로그 수집 설정: collectingInfos'
                logPath:
                  type: string
                  description: 수집할 로그 경로 Cloud Log Analytics 콘솔의 Management 메뉴 참고 <예시>/var/log/messages, /var/log/secure*
                logTemplate:
                  type: string
                  description: 수집할 로그 템플릿 Cloud Log Analytics 콘솔의 Management 메뉴 참고 <예시>APACHE, TOMCAT
                logType:
                  type: string
                  description: 수집할 로그 유형 Cloud Log Analytics 콘솔의 Management 메뉴 참고 <예시>SYSLOG, security_log
                servername:
                  type: string
                  description: 로그 수집 대상 서버 이름 서버 목록 조회 , Bare Metal Server 목록 조회 의 servername 참조
                osType:
                  type: string
                  description: 로그 수집 대상 서버 운영 체제 서버 목록 조회 , Bare Metal Server 목록 조회 의 osName 참조
                instanceNo:
                  type: integer
                  description: 로그 수집 대상 서버 인스턴스 번호 서버 목록 조회 , Bare Metal Server 목록 조회 의 instanceNo 참조
                ip:
                  type: string
                  description: 로그 수집 대상 서버 IP 주소 서버 목록 조회 , Bare Metal Server 목록 조회 의 privateIp 참조
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 응답 상태 코드
                  message:
                    type: string
                    description: 응답 상태 메시지
                  result:
                    type: object
                    additionalProperties: true
                    description: 응답 결과
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
