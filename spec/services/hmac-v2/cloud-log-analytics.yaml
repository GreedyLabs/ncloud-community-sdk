          required: true
          schema:
            type: string
          description: '리전 코드 kr | sgn | jpn | uswn | den kr : 한국 리전 sgn : 싱가포르 리전 jpn : 일본 리전 uswn : 미국 서부 리전 den : 독일 리전'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 응답 상태 코드
                  message:
                    type: string
                    description: 응답 상태 메시지
                  result:
                    type: object
                    additionalProperties: true
                    description: 응답 결과
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
