openapi: 3.0.3
info:
  title: Cloud Log Analytics
  description: Cloud Log Analytics
  version: 1.0.0
  x-ncloud-availability:
    public: true
    financial: true
    gov: true

  x-ncloud-nrn:

    productName: CloudLogAnalytics
    resource_types:
      - Analytics
      - Alarm

servers:
  - url: https://cloudloganalytics.apigw.ntruss.com
    description: cloud-log-analytics 민간
    x-ncloud-env: public
  - url: https://cloudloganalytics.apigw.fin-ntruss.com
    description: cloud-log-analytics 금융
    x-ncloud-env: financial
  - url: https://cloudloganalytics.apigw.gov-ntruss.com
    description: cloud-log-analytics 공공
    x-ncloud-env: gov
