          in: path
          required: true
          schema:
            type: integer
          description: 커넥션 아이디 getConnections 참조
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  connectionId:
                    type: integer
                    description: 커넥션 아이디
                  catalogId:
                    type: integer
                    description: 카탈로그 아이디
                  name:
                    type: string
                    description: 커넥션 이름
                  description:
                    type: string
                    description: 커넥션 설명
                  type:
                    type: string
                    description: 데이터 유형
                  connectionConfigJson:
                    type: object
                    additionalProperties: true
                    description: 데이터 상세 정보
                  createTime:
                    type: string
                    description: 커넥션 생성 일시 ISO 8601 형식
                  updateTime:
                    type: string
                    description: 업데이트 일시 ISO 8601 형식
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
