openapi: 3.0.3
info:
  title: Data Catalog
  description: Data Catalog
  version: 1.0.0
  x-ncloud-availability:
    public: true
    financial: false
    gov: false

  x-ncloud-nrn:

    productName: DataCatalog
    resource_types:
      - TagTemplate
      - Classifier
      - Connection
      - Scanner
      - Database
      - Catalog

servers:
  - url: https://datacatalog.apigw.ntruss.com
    description: data-catalog 민간
    x-ncloud-env: public
security:
  - ncpAccessKey: []
    ncpTimestamp: []
    ncpHmacV2: []
paths:
  /catalogs:
    get:
      operationId: CataLogGetCataLogS
      summary: getCatalogs
      description: VPC 환경에서 이용 가능합니다.
      tags:
        - data-catalog

      x-ncloud-source: https://api.ncloud-docs.com/docs/analytics-datacatalog-catalog-getcatalogs
      parameters:
        - name: pageNo
          in: query
          required: false
          schema:
            type: integer
          description: '페이지 번호 1~N (기본값: 1)'
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
          description: '페이지 출력 수 1~200 (기본값: 20)'
      responses:
        '200':
          description: |
            OK. Verified against the live NCP API on 2026-04-26: the response
            body is a top-level JSON array of catalog objects, not a single
            object as the docparse-derived shape implied.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    catalogId:
                      type: integer
                      description: 카탈로그 아이디
                    catalogStatus:
                      type: string
                      description: '카탈로그 상태 CREATED | DELETED CREATED : 생성됨 DELETED : 삭제됨'
                    metastoreStatus:
                      type: string
                      description: '카탈로그 메타스토어 상태 METASTORE_STARTING | METASTORE_RUNNING | METASTORE_CONFIGURING | METASTORE_STOPPING | METASTORE_STOPPED | METASTORE_FAILED_START METASTORE_STARTING : 시작 중 METASTORE_RUNNING : 정상 METASTORE_CONFIGURING : 재설정 중 METASTORE_STOPPING : 정지 중 METASTORE_STOPPED : 정지 METASTORE_FAILED_START : 시작 실패'
                    createTime:
                      type: string
                      description: 카탈로그 생성 일시 ISO 8601 형식
                    updateTime:
                      type: string
                      description: 업데이트 일시 ISO 8601 형식
                  additionalProperties: true
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
  /catalogs/{catalogId}/connections:
    get:
      operationId: ConnectionGetConnections
      summary: getConnections
      description: VPC 환경에서 이용 가능합니다.
      tags:
        - data-catalog

      x-ncloud-source: https://api.ncloud-docs.com/docs/analytics-datacatalog-connection-getconnections
      parameters:
        - name: catalogId
          in: path
          required: true
          schema:
            type: integer
          description: 카탈로그 아이디 getCatalogs 참조
        - name: pageNo
          in: query
          required: false
          schema:
            type: integer
          description: '페이지 번호 1~N (기본값: 1)'
        - name: pageSize
