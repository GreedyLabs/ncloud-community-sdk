          required: false
          schema:
            type: integer
          description: '페이지 출력 수 1~200 (기본값: 20)'
        - name: searchValue
          in: query
          required: false
          schema:
            type: string
          description: 검색 키워드 커넥션 이름 또는 설명으로 검색 가능 한글 입력 시 URL 인코딩 필요
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  pageNo:
                    type: integer
                    description: 페이지 번호
                  pageSize:
                    type: integer
                    description: 페이지 출력 수
                  totalCount:
                    type: integer
                    description: 응답 결과 수
                  connectionResponseList:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                    description: '커넥션 목록: connectionResponseList'
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
  /catalogs/{catalogId}/connections/{connectionId}:
    get:
