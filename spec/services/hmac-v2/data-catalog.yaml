                  description:
                    type: string
                    description: 데이터베이스 설명
                  location:
                    type: string
                    description: 데이터베이스 위치
                  tagKeyTypeValueList:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                    description: '태그 목록: tagKeyTypeValueList 요청에서 includeTags 가 true 인 경우, 표시'
                  createTime:
                    type: string
                    description: 데이터베이스 생성 일시 ISO 8601 형식
                  updateTime:
                    type: string
                    description: 데이터베이스 업데이트 일시 ISO 8601 형식
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
