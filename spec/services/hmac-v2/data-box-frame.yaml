                  type: string
                  description: "Connect 서버 ncp1 계정 비밀번호 영문 대소문자, 숫자, 특수 문자를 조합하여 8~14자 이내로 입력 사용 불가 특수 문자: ', \", ₩, /, &, `, 공백"
                userPassword2:
