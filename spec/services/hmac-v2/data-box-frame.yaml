                  type: string
                  description: "어드민 서버 접속 비밀번호 영문 대소문자, 숫자, 특수 문자를 조합하여 8~14자 이내로 입력 사용 불가 특수 문자: ', \", ₩, /, &, `, 공백 actionType 이 CREATE 인 경우, 필수 입력"
                count:
                  type: integer
                  description: NAS 개수 actionType 이 CREATE 인 경우, 필수 입력
                nasInstanceNo:
                  type: integer
                  description: NAS 인스턴스 번호 Product Spec Code 참조 actionType 이 DELETE 인 경우, 필수 입력
