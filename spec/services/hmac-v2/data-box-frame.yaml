                  dataBoxFrameName:
                    type: string
                    description: Data Box Frame 이름
                  dataBoxCount:
                    type: string
                    description: Data Box 개수
                  createDate:
                    type: string
                    description: Data Box Frame 생성 일시 YYYY-MM-DD HH:mm:ss 형식
                  statusCode:
                    type: string
                    description: 'Data Box Frame 상태 코드 SET_READY | SET_INIT | SET_USE | SET_ING | SET_RTN | SET_TERMT SET_READY : 신청 중 SET_INIT : 생성 중 SET_USE : 이용 중 SET_ING : 변경 중 SET_RTN : 반납 중 SET_TERMT : 반납 완료'
                  statusName:
                    type: string
                    description: 'Data Box Frame 상태 이름 Request for creating | Initial State | Using | Changing | Returning | Terminated Request for creating : 신청 중 Initial State : 생성 중 Using : 이용 중 Changing : 변경 중 Returning : 반납 중 Terminated : 반납 완료'
