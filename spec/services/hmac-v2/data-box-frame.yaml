                nasList:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                  description: NAS 목록
                actionType:
                  type: string
                  description: '처리 유형 CREATE | UPDATE | DELETE CREATE : 생성 UPDATE : 수정 DELETE : 반납'
                adminServerInstanceNo:
                  type: integer
                  description: 어드민 서버 인스턴스 번호 get-data-box-frame-infra-list 참조 actionType 이 UPDATE 또는 DELETE 인 경우, 필수 입력
