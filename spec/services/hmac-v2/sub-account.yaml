openapi: 3.0.3
info:
  title: sub-account
  description: |
    Sub Account — NCP IAM.
    사용자 / 그룹 / 역할 / 정책 / Access Key / MFA / CRL / TrustAnchor 등을 관리합니다.

    현재 스펙 범위 (22 op):
      • access-keys 그룹 (4)
      • sub-account CRUD + 인증·세션 설정 (18)
    잔여 그룹: groups, policies, roles, profiles, trustanchors, crls, tags, switchable, 2factorauthentication, attach/detach 패밀리.
  version: 1.0.0
  x-ncloud-availability:
    public: true
    financial: true
    gov: true

  x-ncloud-nrn:

    productName: IAM
    resource_types:
      - SubAccount
      - Group
      - Policy
      - Tenant
      - Role

servers:
  - url: https://subaccount.apigw.ntruss.com/api/v1
    description: sub-account 민간
    x-ncloud-env: public
  - url: https://subaccount.apigw.fin-ntruss.com/api/v1
    description: sub-account 금융
    x-ncloud-env: financial
  - url: https://subaccount.apigw.gov-ntruss.com/api/v1
    description: sub-account 공공
    x-ncloud-env: gov
security:
  - ncpAccessKey: []
    ncpTimestamp: []
    ncpHmacV2: []
paths:
  # ---------- sub-accounts (CRUD) ----------
  /sub-accounts:
    get:
      operationId: GetSubAccounts
      summary: 서브 계정 목록 조회
      tags: [sub-account]

      x-ncloud-source: https://api.ncloud-docs.com/docs/management-subaccount-getsubaccounts
      parameters:
        - {name: searchColumn, in: query, schema: {type: string}, description: 검색 대상 컬럼 (loginId/name/email 등)}
        - {name: searchWord, in: query, schema: {type: string}, description: 검색어}
        - {name: page, in: query, schema: {type: integer, default: 0}, description: 페이지 번호 (0~N)}
        - {name: size, in: query, schema: {type: integer, default: 20, minimum: 1, maximum: 100}, description: 페이지 출력 수}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubAccountListResponse'
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
    post:
      operationId: CreateSubAccount
      summary: 서브 계정 생성
      tags: [sub-account]

      x-ncloud-source: https://api.ncloud-docs.com/docs/management-subaccount-createsubaccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubAccountRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [id, success]
                properties:
                  id: {type: string, format: uuid, description: 생성된 서브 계정 아이디}
                  success: {type: boolean}
                  generatedPassword:
                    type: string
                    description: needPasswordGenerate=true 일 때만 반환되는 자동 생성 비밀번호 (1회성).
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
  /sub-accounts/{subAccountId}:
    parameters:
      - name: subAccountId
        in: path
        required: true
        schema: {type: string, format: uuid}
        description: 서브 계정 아이디 (GetSubAccounts 참조)
    get:
      operationId: GetSubAccount
      summary: 서브 계정 상세 조회
      tags: [sub-account]

      x-ncloud-source: https://api.ncloud-docs.com/docs/management-subaccount-getsubaccount
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SubAccountDetail'}
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
    put:
      operationId: UpdateSubAccount
      summary: 서브 계정 정보 수정
      tags: [sub-account]

      x-ncloud-source: https://api.ncloud-docs.com/docs/management-subaccount-putsubaccount
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateSubAccountRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SuccessResponse'}
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
    delete:
      operationId: DeleteSubAccount
      summary: 서브 계정 삭제
      tags: [sub-account]

      x-ncloud-source: https://api.ncloud-docs.com/docs/management-subaccount-deletesubaccount
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SuccessResponse'}
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'

  /sub-accounts/{subAccountId}/password:
    parameters:
      - name: subAccountId
        in: path
        required: true
        schema: {type: string, format: uuid}
    put:
      operationId: ResetSubAccountPassword
      summary: 서브 계정 로그인 비밀번호 재설정
      tags: [sub-account]

      x-ncloud-source: https://api.ncloud-docs.com/docs/management-subaccount-putpassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [needPasswordGenerate]
              properties:
                needPasswordGenerate:
                  type: boolean
                  description: "true: 자동 생성, false: newPassword 직접 입력 필수"
                newPassword:
                  type: string
                  description: needPasswordGenerate=false 일 때 필수
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: {type: boolean}
                  generatedPassword:
                    type: string
                    description: needPasswordGenerate=true 일 때만 반환

        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
  /sub-accounts/{subAccountId}/access-keys:
    # 동일 URL에서 4개 메서드로 분기 (AWS IAM 패턴)
    parameters:
      - name: subAccountId
        in: path
        required: true
        schema: {type: string, format: uuid}
        description: 서브 계정 아이디 (GetSubAccounts 참조)
    post:
      operationId: CreateAccessKey
      summary: 서브 계정의 Access Key 생성
      description: 서브 계정의 새 Access Key / Secret Key 쌍을 발급합니다.
      tags: [sub-account]

      x-ncloud-source: https://api.ncloud-docs.com/docs/management-subaccount-createaccesskey
      requestBody:
        description: '(Per NCP docs this endpoint takes no request body. Source: https://api.ncloud-docs.com/docs/management-subaccount-createaccesskey)'
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NewAccessKey'}
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
    get:
      operationId: GetAccessKeys
      summary: 서브 계정의 Access Key 목록 조회
      tags: [sub-account]

      x-ncloud-source: https://api.ncloud-docs.com/docs/management-subaccount-getaccesskey
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AccessKeyInfo'}
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
    put:
      operationId: SuspendAccessKey
      summary: 서브 계정의 Access Key 상태 변경
      tags: [sub-account]

      x-ncloud-source: https://api.ncloud-docs.com/docs/management-subaccount-suspendkey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accessKey, active]
              properties:
                accessKey: {type: string, description: 상태를 변경할 Access Key}
                active: {type: boolean, description: "true: 활성화, false: 비활성화"}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SuccessResponse'}
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
    delete:
      operationId: DeleteAccessKey
      summary: 서브 계정의 Access Key 삭제
      tags: [sub-account]

      x-ncloud-source: https://api.ncloud-docs.com/docs/management-subaccount-deletekey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accessKey]
              properties:
                accessKey: {type: string, description: 삭제할 Access Key}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SuccessResponse'}
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'

  # ---------- 식별자 helpers ----------
  /sub-accounts-with-no:
    get:
      operationId: GetSubAccountIdByNo
      summary: 서브 계정 번호로 서브 계정 아이디 조회
      tags: [sub-account]

      x-ncloud-source: https://api.ncloud-docs.com/docs/management-subaccount-getsubaccountidno
      parameters:
        - name: subAccountNo
          in: query
          required: true
          explode: true
          schema: {type: array, items: {type: integer}}
          description: 서브 계정 번호 목록 (다중값 — 콤마 또는 반복 파라미터)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    subAccountNo: {type: integer}
                    subAccountId: {type: string, format: uuid}
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'

  /users/{subAccountId}:
    get:
      operationId: GetUserDetail
      summary: 사용자 상세 정보 조회 (그룹 소속 포함)
      tags: [sub-account]

      x-ncloud-source: https://api.ncloud-docs.com/docs/management-subaccount-getuserdetail
      parameters:
        - name: subAccountId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: includeDeleted
          in: query
          required: false
          schema: {type: boolean, default: false}
          description: "true: 삭제된 계정 포함, false: 제외(기본값)"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserDetail'}
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'

  # ---------- 가입 검증 (회원가입 화면용) ----------
  /join/check-login-id:
    get:
      operationId: CheckLoginIdAvailable
      summary: 로그인 아이디 사용 가능 여부 확인
      tags: [sub-account]

      x-ncloud-source: https://api.ncloud-docs.com/docs/management-subaccount-checkloginid
      parameters:
        - name: loginId
          in: query
          required: true
          schema: {type: string}
          description: 검사할 로그인 아이디
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  isValid: {type: boolean, description: 사용 가능 여부 (필드명은 응답 예시 기반 추정)}
                  reason: {type: string, description: 사용 불가 사유 (해당 시)}
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'

  /join/check-password:
    get:
      operationId: CheckPasswordValid
      summary: 비밀번호 정책 충족 여부 검증
      tags: [sub-account]

      x-ncloud-source: https://api.ncloud-docs.com/docs/management-subaccount-checkpassword
      parameters:
        - name: password
          in: query
          required: true
          schema: {type: string}
          description: 검사할 비밀번호 (HTTPS 전송이지만 query string 노출 위험 있음)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  isValid: {type: boolean}
                  reason: {type: string}
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'

  # ---------- 로그인 별칭 (테넌트 alias) ----------
  /login-alias:
    get:
      operationId: GetLoginAlias
      summary: 로그인 별칭 조회
      tags: [sub-account]

      x-ncloud-source: https://api.ncloud-docs.com/docs/management-subaccount-getloginalias
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  loginAlias: {type: string, description: 현재 설정된 로그인 별칭}
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
    put:
      operationId: UpdateLoginAlias
      summary: 로그인 별칭 변경
      tags: [sub-account]

      x-ncloud-source: https://api.ncloud-docs.com/docs/management-subaccount-putloginalias
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [loginAlias]
              properties:
                loginAlias: {type: string, description: 새 로그인 별칭}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SuccessResponse'}
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'

  # ---------- 테넌트 설정 — session / password / idle ----------
  # NOTE: NCP docs slug naming is misleading — slug "get..." 페이지는 실제로 POST(set) 동작이고
  #       slug "post..." 페이지가 GET(read) 동작입니다. spec에서는 HTTP 의미에 맞게 정리.
  /tenant-settings/sub-account-session-policy:
    get:
      operationId: GetSessionExpirationPolicy
      summary: 서브 계정 세션 만료 정책 조회
      tags: [sub-account]

      x-ncloud-source: https://api.ncloud-docs.com/docs/management-subaccount-postsessionexpirationtime
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  useSessionExpiration: {type: boolean}
                  sessionExpirationSec: {type: integer}
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
    post:
      operationId: SetSessionExpirationPolicy
      summary: 서브 계정 세션 만료 정책 설정
      tags: [sub-account]

      x-ncloud-source: https://api.ncloud-docs.com/docs/management-subaccount-getsessionexpirationtime
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [useSessionExpiration]
              properties:
                useSessionExpiration: {type: boolean, description: 세션 만료 사용 여부}
                sessionExpirationSec:
                  type: integer
                  description: 세션 만료 시간(초). useSessionExpiration=true 시 필수.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SuccessResponse'}
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'

  /tenant-settings/sub-account-password-policy:
    get:
      operationId: GetPasswordExpirationPolicy
      summary: 서브 계정 비밀번호 만료 정책 조회
      tags: [sub-account]

      x-ncloud-source: https://api.ncloud-docs.com/docs/management-subaccount-getpasswordexpirationdays
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  usePasswordExpiration: {type: boolean}
                  passwordExpirationDays: {type: integer}
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
    post:
      operationId: SetPasswordExpirationPolicy
      summary: 서브 계정 비밀번호 만료 정책 설정
      tags: [sub-account]

      x-ncloud-source: https://api.ncloud-docs.com/docs/management-subaccount-postpasswordexpirationdays
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [usePasswordExpiration]
              properties:
                usePasswordExpiration: {type: boolean}
                passwordExpirationDays:
                  type: integer
                  description: 비밀번호 만료 일수. usePasswordExpiration=true 시 필수.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SuccessResponse'}
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'

  /tenant-settings/idle-disable-settings:
    get:
      operationId: GetIdleDisablePolicy
      summary: 미접속 비활성화 정책 조회
      tags: [sub-account]

      x-ncloud-source: https://api.ncloud-docs.com/docs/management-subaccount-getidledisable
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  useIdleDisable: {type: boolean}
                  idleDisableDays: {type: integer}
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
    post:
      operationId: SetIdleDisablePolicy
      summary: 미접속 비활성화 정책 설정
      tags: [sub-account]

      x-ncloud-source: https://api.ncloud-docs.com/docs/management-subaccount-postidledisable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [useIdleDisable]
              properties:
                useIdleDisable: {type: boolean}
                idleDisableDays:
                  type: integer
                  description: 미접속 비활성화 기준 일수. useIdleDisable=true 시 필수.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SuccessResponse'}
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'

  # ---------- groups (CRUD) ----------
  /groups:
    get:
      operationId: GetGroups
      summary: 그룹 목록 조회
      tags: [sub-account]

      x-ncloud-source: https://api.ncloud-docs.com/docs/management-subaccount-getgroups
      parameters:
        - {name: searchColumn, in: query, schema: {type: string}, description: 검색 대상 컬럼 (groupName 등)}
        - {name: searchWord, in: query, schema: {type: string}, description: 검색어}
        - {name: page, in: query, schema: {type: integer, default: 0}, description: 페이지 번호}
        - {name: size, in: query, schema: {type: integer, default: 20, minimum: 1, maximum: 100}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GroupListResponse'}
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'

    post:
      operationId: CreateGroup
      summary: 그룹 생성
      tags: [sub-account]

      x-ncloud-source: https://api.ncloud-docs.com/docs/management-subaccount-creategroup
      description: |
        Document360 페이지의 request 표가 sub-table 한 개(`tags`)만 노출되어
        groupName/description 필드가 누락됨. IAM 표준 패턴 기반 추정. 후속 검증 필요.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - groupName
              properties:
                groupName:
                  type: string
                  description: 그룹 이름 한글, 영어 대문자, 소문자, 일어, 특수문자 '.', '_', '-'를 조합하여 3~30자 이내로 입력 첫 글자는 한글, 영어 대소문자, 일어
                tags:
                  type: object
                  additionalProperties:
                    type: string
                  description: 그룹의 태그 리소스당 최대 20개 key, value 제약 조건 참조
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: 'API 호출 성공 여부 true | false true : 성공 false : 실패'
                  id:
                    type: string
                    description: 그룹 아이디
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'

  /groups/{groupId}:
    parameters:
      - name: groupId
        in: path
        required: true
        schema: {type: string, format: uuid}
        description: 그룹 아이디 (GetGroups 참조)
    get:
      operationId: GetGroup
