      tags: [sub-account]

      x-ncloud-source: https://api.ncloud-docs.com/docs/management-subaccount-updatepolicy
      description: 부분 업데이트. permissions를 통째로 교체하는 형식 추정 (NCP docs 표 미공개).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - permissions
                - effect
                - targets
                - product
                - actions
                - resourceNrns
              properties:
                description:
                  type: string
                  description: 정책에 대한 설명(Byte) 0~300
                permissions:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                  description: '허용 권한 목록: permissions'
                effect:
                  type: string
                  description: 권한 허용 여부 Allow (유효 값)
                targets:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                  description: '권한 허용 대상: targets'
                condition:
                  type: object
                  additionalProperties: true
                  description: 정책 컨디션
                product:
                  type: string
                  description: 허용 대상 서비스 코드 서비스별 권한 정보 참조
                actions:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                  description: '허용 대상 액션 서비스별 권한 정보 를 참조하여 다음과 같이 적용 상세 액션 단위: 액션 이름 입력 모든 조회 단위: View* 입력 모든 변경 단위: Change* 입력 서비스 단위: 별표(*) 입력'
                resourceNrns:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                  description: 허용 대상에 대한 네이버 클라우드 플랫폼 리소스 식별 값 지정하지 않을 경우, 별표(*) 입력
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SuccessResponse'}
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'

