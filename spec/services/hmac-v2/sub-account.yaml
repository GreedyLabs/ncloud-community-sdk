          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'

  /subjects/{subjectId}/credentials:
    get:
      operationId: GetSubjectCredentials
      summary: Subject가 사용한 자격 증명(인증서) 이력 조회
      tags: [sub-account]

      x-ncloud-source: https://api.ncloud-docs.com/docs/management-subaccount-getcredentiallist
      parameters:
        - {name: subjectId, in: path, required: true, schema: {type: string}}
        - {name: page, in: query, schema: {type: integer, default: 0}}
        - {name: size, in: query, schema: {type: integer, default: 20}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  pageNo: {type: integer}
                  pageSize: {type: integer}
                  totalElements: {type: integer}
                  totalPages: {type: integer}
                  content:
                    type: array
                    items: {$ref: '#/components/schemas/SubjectCredential'}
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'

  # ---------- 기타 ----------
  /roles/{roleNo}/entities/account:
    get:
      operationId: GetRoleTargetAccount
      summary: 역할의 대상 서브 계정 조회
      description: 특정 역할(roleNo)에 attach된 서브 계정의 이름/로그인 ID 등 메타데이터 조회.
      tags: [sub-account]

      x-ncloud-source: https://api.ncloud-docs.com/docs/management-subaccount-gettargetaccount
      parameters:
        - {name: roleNo, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  isMyAccount: {type: boolean, description: 본인 계정 여부}
                  accountName: {type: string, description: 서브 계정 사용자 이름}
                  loginId: {type: string, description: 서브 계정 로그인 아이디}
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'

  /users/{subAccountId}/last-access-summary:
    get:
      operationId: GetLastAccessSummary
      summary: 서브 계정 마지막 접근 이력 요약
      description: 마지막 로그인, Git 로그인, Access Key 사용 일시 등 inactivity 판단 지표 조회.
      tags: [sub-account]

      x-ncloud-source: https://api.ncloud-docs.com/docs/management-subaccount-getlastaccesssummary
      parameters:
        - {name: subAccountId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  subAccountId:
                    type: string
                    description: 서브 계정 아이디
                  lastLogin:
                    type: string
                    description: 마지막 서브 계정 로그인 일시 ISO 8601 형식
                  lastGitLogin:
                    type: string
                    description: 마지막 Git(Source Commit) 로그인 일시 ISO 8601 형식
                  lastAccessKeyUsed:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                    description: '마지막 AccessKey 사용 정보: lastAccessKeyUsed'
                  unusedDays:
                    type: string
                    description: 서브계정 미사용 일수 ISO 8601 형식
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'

  # ---------- group tags ----------
  /groups/{groupId}/tags:
    parameters:
      - name: groupId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: GetGroupTags
      summary: 그룹 태그 조회
      tags: [sub-account]

      x-ncloud-source: https://api.ncloud-docs.com/docs/management-subaccount-getgrouptag
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/TagItem'}
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
    post:
      operationId: AddGroupTag
      summary: 그룹에 태그 추가
      tags: [sub-account]

      x-ncloud-source: https://api.ncloud-docs.com/docs/management-subaccount-addgrouptag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tagKey
                - tagValue
              properties:
                tagKey:
                  type: string
                  description: 태그 키 key 제약 조건 참조
                tagValue:
                  type: string
                  description: 태그 값 value 제약 조건 참조
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SuccessResponse'}
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'

    delete:
      operationId: RemoveGroupTag
      summary: 그룹에서 태그 제거
      tags: [sub-account]

      x-ncloud-source: https://api.ncloud-docs.com/docs/management-subaccount-removegrouptag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tagKey
                - tagValue
              properties:
                tagKey:
                  type: string
                  description: 태그 키 태그 조회 참조
                tagValue:
                  type: string
                  description: 태그 값 태그 조회 참조
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SuccessResponse'}
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'

components:
  securitySchemes:
    ncpHmacV2:
      type: apiKey
      in: header
      name: x-ncp-apigw-signature-v2
    ncpAccessKey:
      type: apiKey
      in: header
      name: x-ncp-iam-access-key
    ncpTimestamp:
      type: apiKey
      in: header
      name: x-ncp-apigw-timestamp
  schemas:
    SuccessResponse:
      type: object
      required: [success]
      properties:
        success: {type: boolean, description: API 호출 성공 여부}

    NewAccessKey:
      type: object
      description: 신규 발급된 Access Key. keySecret은 최초 생성 응답에만 포함됨 (이후 조회 불가).
      required: [accessKey, keySecret, createTime]
      properties:
        accessKey: {type: string, description: "Access Key (ncp_iam_* 형식)"}
        keySecret: {type: string, description: "Secret Key. 최초 생성 시에만 평문 노출, 이후 조회 불가."}
        createTime: {type: string, format: date-time, description: "생성 일시 (ISO 8601)"}
    AccessKeyInfo:
      type: object
      description: 조회 API가 반환하는 Access Key 정보. keySecret은 제공되지 않음.
      required: [accessKey, active, createTime]
      properties:
        accessKey: {type: string}
        active: {type: boolean, description: 활성 상태}
        createTime: {type: string, format: date-time}

    AccessSourceItem:
      type: object
      description: API 접근 가능 소스 한 건.
      properties:
        type:
          type: string
          enum: [IP, VPC, VPC_SERVER]
          description: "IP: 단일 IP/CIDR, VPC: VPC 단위, VPC_SERVER: 서버 인스턴스 단위"
        source:
          type: string
          description: IP 주소(또는 CIDR) 또는 인스턴스 번호

    CreateSubAccountRequest:
      type: object
      required: [loginId, name, canConsoleAccess, canAPIGatewayAccess, needPasswordReset]
      properties:
        loginId: {type: string, description: 로그인 아이디}
        name: {type: string, description: 사용자 이름 (2~30자)}
        email: {type: string, description: 이메일 주소 (6~100자)}
        memo: {type: string, maxLength: 300, description: 서브 계정 설명 (Bytes 기준 0~300)}
        canConsoleAccess: {type: boolean, description: 콘솔 접근 가능 여부}
        canAPIGatewayAccess: {type: boolean, description: API Gateway 접근 가능 여부}
        needPasswordReset: {type: boolean, description: 첫 로그인 시 비밀번호 변경 안내 여부}
        needPasswordGenerate: {type: boolean, description: "true: 비밀번호 자동 생성 (응답에 generatedPassword 포함), false: password 필수"}
        password:
          type: string
          description: needPasswordGenerate=false 일 때 필수
        isMfaMandatory: {type: boolean, description: 2차 인증 필수 여부}
        useConsolePermitIp: {type: boolean, description: 콘솔 접근 IP 대역 제한 사용}
        consolePermitIps:
          type: array
          items: {type: string}
          description: 허용 IP/CIDR 목록 (useConsolePermitIp=true 시)
        useApiAllowSource: {type: boolean, description: API 접근 소스 제한 사용}
        apiAllowSources:
          type: array
          items: {$ref: '#/components/schemas/AccessSourceItem'}
        tags:
          type: object
          additionalProperties: {type: string}
          description: 사용자 정의 태그 (key/value)

    UpdateSubAccountRequest:
      type: object
      description: 부분 업데이트. 보내지 않은 필드는 변경하지 않음.
      properties:
        name: {type: string}
        email: {type: string}
        memo: {type: string}
        canConsoleAccess: {type: boolean}
        canAPIGatewayAccess: {type: boolean}
        isMfaMandatory: {type: boolean}
        useConsolePermitIp: {type: boolean}
        consolePermitIps:
          type: array
          items: {type: string}
        useApiAllowSource: {type: boolean}
        apiAllowSources:
          type: array
          items: {$ref: '#/components/schemas/AccessSourceItem'}

    SubAccountSummary:
      type: object
      description: 목록 조회 시 반환되는 요약 형태.
      properties:
        subAccountId: {type: string, format: uuid}
        subAccountNo: {type: integer}
        loginId: {type: string}
        name: {type: string}
        email: {type: string}
        active: {type: boolean}
        canConsoleAccess: {type: boolean}
        canAPIGatewayAccess: {type: boolean}
        createTime: {type: string, format: date-time}
        lastLoginTime: {type: string, format: date-time}

    SubAccountListResponse:
      type: object
      description: |
        목록 응답. 페이지/사이즈/총 개수와 items 배열로 구성된다고 가정 (NCP IAM 페이징 패턴).
        실제 응답 키는 docs JSON 예시가 잘려있어 추정 — 후속 검증 필요.
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/SubAccountSummary'}
        page: {type: integer}
        size: {type: integer}
        itemCount: {type: integer}
        hasMore: {type: boolean}
      additionalProperties: true

    SubAccountDetail:
      type: object
      description: GetSubAccount 응답.
      properties:
        subAccountId: {type: string, format: uuid}
        subAccountNo: {type: integer}
        loginId: {type: string}
        name: {type: string}
        email: {type: string}
        memo: {type: string}
        needPasswordReset: {type: boolean, description: 첫 로그인 비밀번호 변경 안내 여부}
        canAPIGatewayAccess: {type: boolean}
        canConsoleAccess: {type: boolean}
        useConsolePermitIp: {type: boolean}
        consolePermitIps:
          type: array
          items: {type: string}
        useApiAllowSource: {type: boolean}
        apiAllowSources:
          type: array
          items: {$ref: '#/components/schemas/AccessSourceItem'}
        lastLoginTime: {type: string, format: date-time}
        createTime: {type: string, format: date-time}

    UserDetail:
      type: object
      description: GetUserDetail 응답 (그룹 소속까지 포함).
      properties:
        subAccountId: {type: string, format: uuid}
        loginId: {type: string}
        name: {type: string}
        active: {type: boolean}
        deleted: {type: boolean}
        createTime: {type: string, format: date-time}
        groups:
          type: array
          items:
            type: object
            properties:
              groupId: {type: string, format: uuid}
              groupName: {type: string}
              nrn: {type: string, description: "Group NRN (nrn:PUB:IAM::<account>:Group/<groupId>)"}
      additionalProperties: true

    # ---- groups family schemas ----
    TagItem:
      type: object
      required: [tagKey, tagValue]
      properties:
        tagKey: {type: string, description: 태그 키 (1~128자)}
        tagValue: {type: string, description: 태그 값 (1~256자)}
        tagDisplay: {type: string, description: '"{tagKey}:{tagValue}" 형식의 표시 문자열'}

    GroupSummary:
      type: object
      description: 그룹 목록 응답 항목.
      properties:
        id: {type: string, format: uuid, description: 그룹 아이디}
        groupName: {type: string}
        description: {type: string}
        nrn: {type: string}
        createTime: {type: string, format: date-time}
      additionalProperties: true

    GroupListResponse:
      type: object
      description: 그룹 페이징 응답 (NCP IAM의 totalPages/totalItems/hasPrevious/hasNext 패턴).
      properties:
        totalPages: {type: integer, description: 전체 페이지 수}
        totalItems: {type: integer, description: 응답 결과 수}
        hasPrevious: {type: boolean}
        hasNext: {type: boolean}
        items:
          type: array
          items: {$ref: '#/components/schemas/GroupSummary'}
      additionalProperties: true

    GroupDetail:
      type: object
      description: 그룹 상세 (멤버 + 정책 + NRN까지 포함). 추가 필드는 docs JSON 예시 미공개.
      properties:
        id: {type: string, format: uuid}
        groupName: {type: string}
        description: {type: string}
        nrn: {type: string, description: "Group NRN (nrn:PUB:IAM::<account>:Group/<groupId>)"}
        subAccounts:
          type: array
          description: 그룹에 속한 서브 계정 목록
          items:
            type: object
            properties:
              subAccountId: {type: string, format: uuid}
              loginId: {type: string}
              name: {type: string}
            additionalProperties: true
        policies:
          type: array
          description: 그룹에 할당된 정책 목록
          items:
            type: object
            properties:
              policyId: {type: string, format: uuid}
              policyName: {type: string}
              nrn: {type: string}
            additionalProperties: true
      additionalProperties: true

    # ---- policies family schemas ----
    PolicyPermission:
      type: object
      description: |
        정책 권한 항목. AWS IAM Statement 형식과 유사 (action + resource).
        정확한 키 이름은 NCP docs 미공개 — 실제 호출 시 확인 후 보정 필요.
      properties:
        action:
          type: array
          items: {type: string}
          description: 허용/거부할 API 액션 목록 (예 "ncp:vserver:*")
        resource:
          type: array
          items: {type: string}
          description: 적용 대상 리소스 NRN 목록 (예 "nrn:PUB:vserver:KR:*:Server/*")
        effect:
          type: string
          enum: [ALLOW, DENY]
          default: ALLOW
        condition:
          type: object
          additionalProperties: true
      additionalProperties: true

    CreatePolicyRequest:
      type: object
      required: [policyName, permissions]
      properties:
        policyName: {type: string, description: 정책 이름}
        description: {type: string, description: 정책 설명}
        permissions:
          type: array
          items: {$ref: '#/components/schemas/PolicyPermission'}
          description: 권한 항목 목록 (1개 이상)
        tags:
          type: object
          additionalProperties: {type: string}

    PolicySummary:
      type: object
      description: 정책 목록 응답 항목.
      properties:
        policyId: {type: string, format: uuid}
        policyName: {type: string}
        policyType:
          type: string
          enum: [SYSTEM, USER]
          description: "SYSTEM: NCP 기본 제공 정책, USER: 사용자 정의 정책"
        policyDesc: {type: string}
        nrn: {type: string}
        createTime: {type: string, format: date-time}
      additionalProperties: true

    PolicyListResponse:
      type: object
      properties:
        totalPages: {type: integer}
        totalItems: {type: integer}
        hasPrevious: {type: boolean}
        hasNext: {type: boolean}
        items:
          type: array
          items: {$ref: '#/components/schemas/PolicySummary'}
      additionalProperties: true

    PolicyDetail:
      type: object
      description: 정책 상세 — product / actions / resourceNrns 트리플 형태로 응답.
      properties:
        policyId: {type: string, format: uuid}
        policyName: {type: string}
        description: {type: string}
        product:
          type: string
          description: "적용 NCP 프로덕트 (예: vserver, vpc)"
        actions:
          type: array
          items: {type: string}
        resourceNrns:
          type: array
          items: {type: string}
        permissions:
          type: array
          items: {$ref: '#/components/schemas/PolicyPermission'}
      additionalProperties: true

    # ---- roles family schemas ----
    CreateRoleRequest:
      type: object
      required: [roleName]
      properties:
        roleName: {type: string}
        description: {type: string}
        trustedEntities:
          type: array
          description: 역할이 신뢰하는 엔티티 (서브 계정/그룹/외부 IDP 등). 필드명·구조 추정.
          items:
            type: object
            additionalProperties: true
        tags:
          type: object
          additionalProperties: {type: string}

    RoleSummary:
      type: object
      properties:
        roleId: {type: string, format: uuid}
        roleName: {type: string}
        nrn: {type: string}
        active: {type: boolean}
        createTime: {type: string, format: date-time}
      additionalProperties: true

    RoleListResponse:
      type: object
      properties:
        totalPages: {type: integer}
        totalItems: {type: integer}
        hasPrevious: {type: boolean}
        hasNext: {type: boolean}
        items:
          type: array
          items: {$ref: '#/components/schemas/RoleSummary'}
      additionalProperties: true

    RoleDetail:
      type: object
      description: |
        역할 상세. agent 추출이 필드명을 못 잡아 (column shift) IAM 표준 패턴으로 추정.
        실제 호출 후 보정 필요.
      properties:
        roleId: {type: string, format: uuid}
        roleName: {type: string}
        nrn: {type: string}
        description: {type: string}
        active: {type: boolean}
        entities:
          type: array
          description: 역할 적용 대상 엔티티 목록 (사용자/그룹)
          items:
            type: object
            properties:
              entityType: {type: string, enum: [ACCOUNT, GROUP, RESOURCE]}
              entityId: {type: string}
              entityName: {type: string}
            additionalProperties: true
        policies:
          type: array
          description: 역할에 부착된 정책 목록
          items:
            type: object
            properties:
              policyId: {type: string, format: uuid}
              policyName: {type: string}
              nrn: {type: string}
            additionalProperties: true
      additionalProperties: true

    Profile:
      type: object
      description: X.509 인증된 엔터티가 assume할 역할 세트 + 세션 정책.
      properties:
        profileId: {type: string}
        profileNrn: {type: string}
        name: {type: string}
        description: {type: string}
        enabled: {type: boolean}
        durationSeconds: {type: integer, description: 임시 자격 증명 지속 시간(초)}
        roleIdList:
          type: array
          items: {type: string, format: uuid}
          description: 이 Profile이 assume 가능한 역할 ID 목록
        createdAt: {type: string, format: date-time}
        modifiedAt: {type: string, format: date-time}
      additionalProperties: true

    ProfileListResponse:
      type: object
      properties:
        pageNo: {type: integer}
        pageSize: {type: integer}
        totalElements: {type: integer}
        totalPages: {type: integer}
        items:
          type: array
          items: {$ref: '#/components/schemas/Profile'}
      additionalProperties: true

    TrustAnchorSource:
      type: object
      description: Trust Anchor의 CA 정보 (source.sourceType + source.sourceData 계층).
      required: [sourceType, sourceData]
      properties:
        sourceType:
          type: string
          enum: [CERTIFICATE_BUNDLE, ACM_PCA]
          description: "CERTIFICATE_BUNDLE: PEM 인증서 번들 업로드, ACM_PCA: Private CA 연동 (필드값 추정)"
        sourceData:
          type: object
          description: sourceType별 CA 세부 정보 (구조 추정)
          additionalProperties: true

    TrustAnchor:
      type: object
      description: 클라이언트 인증서 발급 CA 루트.
      properties:
        trustAnchorId: {type: string}
        trustAnchorNrn: {type: string}
        name: {type: string}
        description: {type: string}
        enabled: {type: boolean}
        source: {$ref: '#/components/schemas/TrustAnchorSource'}
        createdAt: {type: string, format: date-time}
        modifiedAt: {type: string, format: date-time}
      additionalProperties: true

    TrustAnchorListResponse:
      type: object
      properties:
        pageNo: {type: integer}
        pageSize: {type: integer}
        totalElements: {type: integer}
        totalPages: {type: integer}
        items:
          type: array
          items: {$ref: '#/components/schemas/TrustAnchor'}
      additionalProperties: true

    Crl:
      type: object
      description: 인증서 해지 목록. Trust Anchor에 속함.
      properties:
        crlId: {type: string}
        crlNrn: {type: string}
        trustAnchorId: {type: string}
        name: {type: string}
        crlData: {type: string, description: Base64로 인코딩된 CRL 바이너리}
        enabled: {type: boolean}
        createdAt: {type: string, format: date-time}
        modifiedAt: {type: string, format: date-time}
      additionalProperties: true

    # ---- Subjects (X.509 authenticated principal) ----
    Subject:
      type: object
      description: X.509 인증서로 인증된 호출 주체. Roles Anywhere 세션의 identity 기록.
      properties:
        subjectId: {type: string}
        subjectNrn: {type: string}
        x509Subject: {type: string, description: 인증서의 X.509 Subject DN}
        enabled: {type: boolean}
        createTime: {type: string, format: date-time}
        modifiedAt: {type: string, format: date-time}
        lastSeenTime: {type: string, format: date-time}
      additionalProperties: true

    SubjectListResponse:
      type: object
      properties:
        pageNo: {type: integer}
        pageSize: {type: integer}
        totalElements: {type: integer}
        totalPages: {type: integer}
        content:
          type: array
          items: {$ref: '#/components/schemas/Subject'}
      additionalProperties: true

    SubjectCredential:
      type: object
      description: Subject가 과거에 제시한 X.509 인증서 기록.
      properties:
        issuer: {type: string, description: 인증서 발급자}
        serialNumber: {type: string, description: 인증서 번호}
        x509CertificateData: {type: string, description: X.509 인증서 데이터 (PEM 또는 base64)}
        failed: {type: boolean, description: 인증 실패 여부}
        seenTime: {type: string, format: date-time, description: "인증 시각 (ISO 8601)"}
      additionalProperties: true
    NcloudErrorEnvelope:
      type: object
      description: 'Naver Cloud Platform standard error envelope. Most products return this shape; some (Object Storage, CLOVA) wrap differently — `additionalProperties: true` keeps clients tolerant.'
      properties:
        responseError:
          type: object
          description: 'Error detail (present on most NCP product errors). Field shape varies; `additionalProperties: true` keeps clients tolerant.'
          properties:
            returnCode:
              type: string
              description: NCP error code.
            returnMessage:
              type: string
              description: Human-readable error message.
          additionalProperties: true
        error:
          description: 'Alternative error field. Type varies: object (CLOVA, NCP standard), string (cert-manager Spring Boot 404), or null.'
      additionalProperties: true
  responses:
    NcloudClientError:
      description: Client error (4xx) — NCP error envelope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NcloudErrorEnvelope'
    NcloudServerError:
      description: Server error (5xx) — NCP error envelope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NcloudErrorEnvelope'
