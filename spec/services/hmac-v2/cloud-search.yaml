            type: string
          description: '검색 결과로 보여줄 섹션을 지정(지정하지 않으면 모든 섹션 데이터 출력) 예 : 가격과 이름만 결과로 출력하고 싶을 때, "price, name" 여러 섹션 조합 가능 예 : 브랜드와 이름을 하나의 결과로 출력하고 싶을 때, "brand+name"'
        - name: passage
          in: query
          required: false
          schema:
            type: string
          description: 검색 결과 추출 방식 설정
        - name: aggregate
          in: query
          required: false
          schema:
            type: string
          description: 검색 결과 요약 설정 목록
        - name: result_processing
