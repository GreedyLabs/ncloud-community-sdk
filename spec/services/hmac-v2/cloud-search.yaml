          in: query
          required: false
          schema:
            type: string
          description: 검색 할 색인의 이름
        - name: queryList
          in: query
          required: false
          schema:
            type: string
          description: 검색 요청 쿼리
        - name: sort
          in: query
          required: false
          schema:
            type: object
            additionalProperties: true
          description: '검색 결과 정렬 기준을 가지는 Map 형태의 Object key : 정렬 기준 섹션 value : 정렬 방식 지정(desc, asc)'
        - name: scope
          in: query
          required: false
          schema:
            type: string
          description: 제한 검색 설정 목록
        - name: key_scope
          in: query
          required: false
          schema:
            type: object
            additionalProperties: true
          description: '제한 검색을 설정하는 Map 형태의 Object key : 제한 검색 방식 선택 value : 제한 검색 방식에 따른 값 설정 key 옵션 종류 - exist, nexist: 지정한 값이 존재하는 문서 속성으로 검색 결과를 제한'
        - name: user_scope
          in: query
          required: false
          schema:
            type: string
          description: 사용자가 직접 scope 수식을 입력, 입력된 수식은 'scope' 파라미터의 내용과 and 조건으로 추가됨 ex) price가 2000 초과 5000 미인 문서를 찾을 때,"(dp_price > '2000') and (dp_price < '5000')"
