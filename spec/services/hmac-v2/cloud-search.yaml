  /CloudSearch/real/v1/domain:
    get:
      operationId: GetDomainList
      summary: 예시
      description: 전체 도메인 목록을 조회합니다.
      tags:
        - cloud-search

      x-ncloud-source: https://api.ncloud-docs.com/docs/analytics-cloudsearch-getdomainlist
      parameters:
        - name: haveContainer
          in: query
          required: false
          schema:
            type: boolean
          description: 컨테이너 정보 조회 여부
        - name: haveUsage
          in: query
          required: false
          schema:
            type: boolean
          description: 도메인 사용량 정보 조회 여부
      responses:
        '200':
          description: |
            OK. Verified against the live NCP API on 2026-04-26: the response
            body is a top-level JSON array of domain objects, not the wrapped
            object shape implied by earlier docparse runs.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
    post:
      operationId: CreateDomain
      summary: 예시
      description: 도메인을 생성합니다 자동 완성 설정 및 수정 은 도메인 생성 이 후 가능합니다. 색인(index)은 도메인 생성 이 후 추가는 가능하지만, 생성 후 삭제는 불가능합니다.
      tags:
        - cloud-search

      x-ncloud-source: https://api.ncloud-docs.com/docs/analytics-cloudsearch-createdomain
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: 생성할 Domain 이름
        - name: type
          in: query
          required: false
          schema:
            type: string
          description: '컨테이너 규모 설정 small: Standard - 4: 메모리 4GB / 스토리지 30GB / 권장 최대 문서수 100만 개 / 권장 색인 2개 medium: Standard - 8: 메모리 8GB / 스토리지 50GB / 권장 최대 문서수 200만 개 / 권장 색인 3개 large: Standard - 16: 메모리 16GB / 스토리지 100GB / 권장 최대 문서수 400만 개 / 권장 색인 4개 xlarge: Standard - 32: 메모리 32GB / 스토리지 200GB / 권장 최대 문서수 800만 개 / 권장 색인 5개 xxlarge: High Memory - 64: 메모리 64GB / 스토리지 400GB / 권장 최대 문서수 1600만 개 / 권장 색인 6개 xxxlarge: High Memory - 128: 메모리 128GB / 스토리지 800GB / 권장 최대 문서수 3200만 개 / 권장 색인 7개'
        - name: indexerCount
          in: query
          required: false
          schema:
            type: number
          description: 색인을 담당하는 컨테이너의 개수
        - name: searcherCount
          in: query
          required: false
          schema:
            type: number
          description: 검색을 담당하는 컨테이너의 개수
        - name: description
          in: query
          required: false
          schema:
            type: string
          description: 생성할 도메인에 대한 설명
      responses:
