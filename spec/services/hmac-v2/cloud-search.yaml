      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: 생성되어져 있는 Domain 이름
        - name: start
          in: query
          required: false
          schema:
            type: string
          description: 검색 결과의 시작 랭킹
        - name: display
          in: query
          required: false
          schema:
            type: string
          description: 검색 결과의 개수
