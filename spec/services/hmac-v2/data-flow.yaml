          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
  /stats/executions:
    get:
      operationId: GetExecutionResult
      summary: getExecutionResult
      description: VPC 환경에서 이용 가능합니다.
      tags:
        - data-flow

      x-ncloud-source: https://api.ncloud-docs.com/docs/analytics-dataflow-getexecutionresult
