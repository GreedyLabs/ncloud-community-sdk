                  createdDate:
                    type: string
                    description: 작업 생성 일시 ISO 8601 형식(UTC+9 포함)
                  triggerId:
                    type: string
                    description: 트리거 아이디
                  triggerName:
                    type: string
                    description: 트리거 이름
