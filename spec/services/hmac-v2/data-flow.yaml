          in: path
          required: true
          schema:
            type: string
          description: 작업 실행 아이디 getJobExecutions 참조
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobExecutionId:
                    type: string
                    description: 작업 실행 아이디
                  jobId:
                    type: string
                    description: 작업 아이디
                  jobCondition:
                    type: object
                    additionalProperties: true
                    description: 작업 실행 옵션 정보
                  status:
                    type: string
