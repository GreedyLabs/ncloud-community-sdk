                    type: integer
                    description: 성공 횟수
                  failedCount:
                    type: integer
                    description: 실패 횟수
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
  /stats/executions-interval:
    get:
      operationId: GetExecutionCount
      summary: getExecutionInterval
      description: VPC 환경에서 이용 가능합니다.
      tags:
        - data-flow

      x-ncloud-source: https://api.ncloud-docs.com/docs/analytics-dataflow-getexecutioncount
      parameters:
        - name: startDate
