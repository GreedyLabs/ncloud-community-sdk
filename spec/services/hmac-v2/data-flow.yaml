openapi: 3.0.3
info:
  title: Data Flow
  description: Data Flow
  version: 1.0.0
  x-ncloud-availability:
    public: true
    financial: false
    gov: false

  x-ncloud-nrn:

    productName: DataFlow
    resource_types:
      - Workflow
      - Trigger
      - Job

servers:
  - url: https://dataflow.apigw.ntruss.com/api/v1
    description: data-flow 민간
    x-ncloud-env: public
security:
  - ncpAccessKey: []
    ncpTimestamp: []
    ncpHmacV2: []
paths:
  /jobs:
    get:
      operationId: GetJobs
      summary: getJobs
      description: VPC 환경에서 이용 가능합니다.
      tags:
        - data-flow

      x-ncloud-source: https://api.ncloud-docs.com/docs/analytics-dataflow-getjobs
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: 작업 이름
        - name: status
          in: query
          required: false
          schema:
            type: string
          description: '작업 상태 RUNNABLE | RUNNING | DELETED | UNKNOWN | DRAFT | STOPPED | EDITING RUNNABLE : 작업 실행 가능 RUNNING : 작업 실행 중 DELETED : 작업 삭제 중 또는 삭제 완료 UNKNOWN : 기타 DRAFT : 작업 편집 미완료 STOPPED : 작업 정지 중 EDITING : 작업 수정 중(유효성 검증 필요)'
        - name: page
          in: query
          required: false
          schema:
            type: integer
          description: '페이지 번호 0~N (기본값: 0)'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
          description: '페이지 출력 수 0~N (기본값: 1000)'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  list:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                    description: '작업 목록: list'
                  count:
                    type: integer
                    description: 응답 결과 수
                  page:
                    type: integer
                    description: 페이지 번호
                  limit:
                    type: integer
                    description: 페이지 출력 수
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
    post:
      operationId: CreateJob
      summary: createJob
      description: VPC 환경에서 이용 가능합니다.
      tags:
        - data-flow

      x-ncloud-source: https://api.ncloud-docs.com/docs/analytics-dataflow-createjob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - nodes
              properties:
                name:
                  type: string
                  description: 작업 이름 영문자, 숫자, 특수 문자 '_', '-'를 조합하여 3~100자 이내로 입력 문자열의 시작은 영문자 또는 '_'로 구성
                nodes:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                  description: 작업 노드 정보 ETLJobNode 참조
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId:
                    type: string
                    description: 작업 아이디
                  name:
                    type: string
                    description: 작업 이름
                  type:
                    type: string
                    description: 작업 유형 DATAFLOW (기본값)
                  status:
                    type: string
                    description: '작업 상태 RUNNABLE | RUNNING | DELETED | UNKNOWN | DRAFT | STOPPED | EDITING RUNNABLE : 작업 실행 가능 RUNNING : 작업 실행 중 DELETED : 작업 삭제 중 또는 삭제 완료 UNKNOWN : 기타 DRAFT : 작업 편집 미완료 STOPPED : 작업 정지 중 EDITING : 작업 수정 중(유효성 검증 필요)'
                  nodes:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                    description: 작업 노드 정보 ETLJobNode 참조
                  runCondition:
                    type: object
                    additionalProperties: true
                    description: 작업 실행 옵션
                  createdDate:
                    type: string
                    description: 작업 생성 일시 ISO 8601 형식(UTC+9 포함)
                  updatedDate:
                    type: string
                    description: 작업 수정 일시 ISO 8601 형식(UTC+9 포함)
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
  /jobs/verify:
    post:
      operationId: VerifyJob
      summary: verifyJob
      description: VPC 환경에서 이용 가능합니다.
      tags:
        - data-flow

      x-ncloud-source: https://api.ncloud-docs.com/docs/analytics-dataflow-verifyjob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - nodes
              properties:
                name:
                  type: string
                  description: 작업 이름 영문자, 숫자, 특수 문자 '_', '-'를 조합하여 3~100자 이내로 입력 문자열의 시작은 영문자 또는 '_'로 구성
                nodes:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                  description: 작업 노드 정보 ETLJobNode 참조
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
  /jobs/{jobId}:
    get:
      operationId: GetJobById
      summary: getJobById
      description: VPC 환경에서 이용 가능합니다.
      tags:
        - data-flow

      x-ncloud-source: https://api.ncloud-docs.com/docs/analytics-dataflow-getjobbyid
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
          description: 작업 아이디 getJobs 참조
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId:
                    type: string
                    description: 작업 아이디
                  name:
                    type: string
                    description: 작업 이름
                  type:
                    type: string
                    description: 작업 유형 DATAFLOW (기본값)
                  status:
                    type: string
                    description: '작업 상태 RUNNABLE | RUNNING | DELETED | UNKNOWN | DRAFT | STOPPED | EDITING RUNNABLE : 작업 실행 가능 RUNNING : 작업 실행 중 DELETED : 작업 삭제 중 또는 삭제 완료 UNKNOWN : 기타 DRAFT : 작업 편집 미완료 STOPPED : 작업 정지 중 EDITING : 작업 수정 중(유효성 검증 필요)'
                  lastExecutionStatus:
                    type: string
                    description: '마지막 작업 실행 상태 READY | RUNNING | COMPLETED | FAILED | CANCELED READY : 대기 중 RUNNING : 실행 중 COMPLETED : 완료 FAILED : 실패 CANCELED : 취소'
                  nodes:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                    description: 작업 노드 정보 ETLJobNode 참조
                  runCondition:
                    type: object
                    additionalProperties: true
                    description: 작업 실행 옵션
                  createdDate:
                    type: string
                    description: 작업 생성 일시 ISO 8601 형식(UTC+9 포함)
                  updatedDate:
                    type: string
                    description: 작업 수정 일시 ISO 8601 형식(UTC+9 포함)
                  lastExecutionDate:
                    type: string
                    description: 마지막 작업 실행 일시 ISO 8601 형식(UTC+9 포함)
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
    put:
      operationId: UpdateJob
      summary: updateJob
      description: VPC 환경에서 이용 가능합니다.
      tags:
        - data-flow

      x-ncloud-source: https://api.ncloud-docs.com/docs/analytics-dataflow-updatejob
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
          description: 작업 아이디 getJobs 참조
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - type
              properties:
                name:
                  type: string
                  description: 작업 이름 영문자, 숫자, 특수 문자 '_', '-'를 조합하여 3~100자 이내로 입력 문자열의 시작은 영문자 또는 '_'로 구성
                isTemp:
                  type: boolean
                  description: '임시 저장 여부 true | false true : 임시 저장 false : 즉시 완료(임시 저장 안 함)'
                type:
                  type: string
                  description: 작업 유형 DATAFLOW (기본값)
                nodes:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                  description: 작업 노드 정보 ETLJobNode 참조
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId:
                    type: string
                    description: 작업 아이디
                  name:
                    type: string
                    description: 작업 이름
                  type:
                    type: string
                    description: 작업 유형 DATAFLOW (기본값)
                  status:
                    type: string
                    description: '작업 상태 RUNNABLE | RUNNING | DELETED | UNKNOWN | DRAFT | STOPPED | EDITING RUNNABLE : 작업 실행 가능 RUNNING : 작업 실행 중 DELETED : 작업 삭제 중 또는 삭제 완료 UNKNOWN : 기타 DRAFT : 작업 편집 미완료 STOPPED : 작업 정지 중 EDITING : 작업 수정 중(유효성 검증 필요)'
                  nodes:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                    description: 작업 노드 정보 ETLJobNode 참조
                  runCondition:
                    type: object
                    additionalProperties: true
                    description: 작업 실행 옵션
                  createdDate:
                    type: string
                    description: 작업 생성 일시 ISO 8601 형식(UTC+9 포함)
                  updatedDate:
                    type: string
                    description: 작업 수정 일시 ISO 8601 형식(UTC+9 포함)
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
    delete:
      operationId: DeleteJob
      summary: deleteJob
      description: VPC 환경에서 이용 가능합니다.
      tags:
        - data-flow

      x-ncloud-source: https://api.ncloud-docs.com/docs/analytics-dataflow-deletejob
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
          description: 작업 아이디 getJobs 참조
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
  /jobs/{jobId}/executions:
    get:
      operationId: GetJobExecutions
      summary: getJobExecutions
      description: VPC 환경에서 이용 가능합니다.
      tags:
