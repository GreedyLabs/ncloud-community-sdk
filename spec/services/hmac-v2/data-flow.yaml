          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId:
                    type: string
                    description: 작업 아이디
                  name:
                    type: string
                    description: 작업 이름
                  type:
                    type: string
                    description: 작업 유형 DATAFLOW (기본값)
                  status:
                    type: string
                    description: '작업 상태 RUNNABLE | RUNNING | DELETED | UNKNOWN | DRAFT | STOPPED | EDITING RUNNABLE : 작업 실행 가능 RUNNING : 작업 실행 중 DELETED : 작업 삭제 중 또는 삭제 완료 UNKNOWN : 기타 DRAFT : 작업 편집 미완료 STOPPED : 작업 정지 중 EDITING : 작업 수정 중(유효성 검증 필요)'
                  nodes:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                    description: 작업 노드 정보 ETLJobNode 참조
                  runCondition:
                    type: object
                    additionalProperties: true
                    description: 작업 실행 옵션
                  createdDate:
                    type: string
                    description: 작업 생성 일시 ISO 8601 형식(UTC+9 포함)
                  updatedDate:
                    type: string
                    description: 작업 수정 일시 ISO 8601 형식(UTC+9 포함)
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
