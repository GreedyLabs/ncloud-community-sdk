                    type: string
                    description: 작업 이름
                  waitingTime:
                    type: integer
                    description: 작업 대기 시간(분)
                  executorNum:
                    type: integer
                    description: 작업 워커 수
                  runningTime:
                    type: integer
                    description: 작업 실행 시간(분)
                  parsedParameters:
                    type: object
                    additionalProperties: true
                    description: 파싱된 작업 실행 파라미터
                  type:
                    type: string
                    description: 작업 유형 JOB | WORKFLOW
