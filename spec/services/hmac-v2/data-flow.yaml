      x-ncloud-source: https://api.ncloud-docs.com/docs/analytics-dataflow-getjobexecutions
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
          description: 작업 아이디 getJobs 참조
        - name: page
          in: query
          required: false
          schema:
            type: integer
          description: '페이지 번호 0~N (기본값: 0)'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
          description: '페이지 출력 수 0~N (기본값: 1000)'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  list:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                    description: '작업 실행 목록: list'
                  count:
                    type: integer
                    description: 응답 결과 수
                  page:
                    type: integer
                    description: 페이지 번호
                  limit:
                    type: integer
                    description: 페이지 출력 수
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
    post:
      operationId: ExecuteJob
      summary: executeJob
      description: VPC 환경에서 이용 가능합니다.
      tags:
        - data-flow

      x-ncloud-source: https://api.ncloud-docs.com/docs/analytics-dataflow-executejob
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
          description: 작업 아이디 getJobs 참조
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - jobCondition
              properties:
                triggerId:
                  type: string
                  description: 트리거 아이디 getTriggers 참조
                workflowId:
                  type: string
                  description: 워크플로 아이디 getWorkflows 참조
                jobCondition:
                  type: object
                  additionalProperties: true
                  description: 작업 실행 옵션 정보
                parameters:
                  type: object
                  additionalProperties: true
                  description: 작업 실행 파라미터
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobExecutionId:
                    type: string
                    description: 작업 실행 아이디
                  jobId:
                    type: string
                    description: 작업 아이디
                  jobCondition:
                    type: object
                    additionalProperties: true
                    description: 작업 실행 옵션 정보
                  status:
                    type: string
                    description: '마지막 작업 실행 상태 READY | RUNNING | COMPLETED | FAILED | CANCELED READY : 대기 중 RUNNING : 실행 중 COMPLETED : 완료 FAILED : 실패 CANCELED : 취소'
                  startDate:
                    type: string
                    description: 작업 실행 일시 ISO 8601 형식(UTC+9 포함)
                  createdDate:
                    type: string
                    description: 작업 생성 일시 ISO 8601 형식(UTC+9 포함)
                  runningTime:
                    type: integer
                    description: 작업 실행 시간(분)
                  parsedParameters:
                    type: object
                    additionalProperties: true
                    description: 파싱된 작업 실행 파라미터
                  type:
                    type: string
                    description: 작업 유형 JOB (기본값)
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
    put:
      operationId: UpdateJobExecuteConfig
      summary: updateJobExecuteConfig
      description: VPC 환경에서 이용 가능합니다.
      tags:
        - data-flow

      x-ncloud-source: https://api.ncloud-docs.com/docs/analytics-dataflow-updatejobexecuteconfig
      parameters:
        - name: jobId
