        regionCode:
          type: string
          description: "REGION 코드"
        serverImageProductCode:
          type: string
          description: "서버이미지상품코드"
        memberServerImageInstanceNo:
          type: string
          description: "회원서버이미지인스턴스 번호"
        serverProductCode:
          type: string
          description: "서버상품코드"
        isEncryptedVolume:
          type: boolean
          description: "볼륨암호화여부"
        initScriptNo:
          type: string
          description: "초기화스크립트번호"
        launchConfigurationName:
          type: string
          description: "론치설정이름"
        loginKeyName:
          type: string
          description: "로그인키이름"
    CreateLaunchConfigurationResponse:
      type: object
