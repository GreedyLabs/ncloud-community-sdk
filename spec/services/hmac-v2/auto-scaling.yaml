components:
  schemas:
    ActivityLog:
      type: object
      properties:
        autoScalingGroupNo:
          type: string
          description: "오토스케일링그룹 번호"
        activityNo:
          type: string
          description: "액티비티번호"
        serverInstanceNo:
          type: string
          description: "서버인스턴스 번호"
        zoneCode:
          type: string
          description: "ZONE 코드"
        actionName:
          type: string
          description: "액션이름"
        actionStatus:
          $ref: '#/components/schemas/CommonCode'
        actionCause:
          type: string
          description: "액션원인"
        actionDescription:
          type: string
          description: "액션설명"
        startTime:
          type: string
          description: "시작일시"
        endTime:
          type: string
          description: "종료일시"
    AdjustmentType:
      type: object
      properties:
        code:
          type: string
          description: "코드"
        codeName:
          type: string
          description: "코드이름"
    AutoScalingGroup:
      type: object
      properties:
        vpcNo:
          type: string
          description: "VPC 번호"
        subnetNo:
          type: string
          description: "서브넷 번호"
        serverNamePrefix:
          type: string
          description: "서버 이름 Prefix"
        autoScalingGroupNo:
          type: string
          description: "오토스케일링그룹 번호"
        autoScalingGroupName:
          type: string
          description: "오토스케일링그룹 이름"
        launchConfigurationNo:
          type: string
          description: "론치설정번호"
        minSize:
          type: integer
          format: int32
          description: "최소용량"
        maxSize:
          type: integer
          format: int32
          description: "최대용량"
        desiredCapacity:
          type: integer
          format: int32
          description: "기대용량"
        defaultCoolDown:
          type: integer
          format: int32
          description: "쿨다운기본값"
        healthCheckGracePeriod:
          type: integer
          format: int32
          description: "헬스체크보류기간"
        healthCheckType:
          $ref: '#/components/schemas/CommonCode'
        createDate:
          type: string
          description: "생성일시"
        autoScalingGroupStatus:
          $ref: '#/components/schemas/CommonCode'
        targetGroupNoList:
          type: array
          description: "타겟그룹 번호 리스트"
          items:
            type: string
        inAutoScalingGroupServerInstanceList:
          type: array
          description: "오토스케일링그룹에속한서버인스턴스 리스트"
          items:
            $ref: '#/components/schemas/InAutoScalingGroupServerInstance'
        accessControlGroupNoList:
          type: array
          description: "ACG 번호 리스트"
          items:
            type: string
        suspendedProcessList:
          type: array
          description: "일시정지된프로세스리스트"
          items:
            $ref: '#/components/schemas/SuspendedProcess'
    CommonCode:
      type: object
      properties:
        code:
          type: string
          description: "코드"
        codeName:
          type: string
          description: "코드명"
    CreateAutoScalingGroupRequest:
      type: object
      properties:
        regionCode:
          type: string
          description: "REGION 코드"
        launchConfigurationNo:
          type: string
          description: "론치설정번호"
        autoScalingGroupName:
          type: string
          description: "오토스케일링그룹 이름"
        vpcNo:
          type: string
          description: "VPC 번호"
        subnetNo:
          type: string
          description: "서브넷 번호"
        accessControlGroupNoList:
          type: array
          description: "ACG 번호 리스트"
          items:
            type: string
        serverNamePrefix:
          type: string
          description: "서버 이름 Prefix"
        minSize:
          type: integer
          format: int32
          description: "최소용량"
        maxSize:
          type: integer
          format: int32
          description: "최대용량"
        desiredCapacity:
          type: integer
          format: int32
          description: "기대용량"
        defaultCoolDown:
          type: integer
          format: int32
          description: "쿨다운기본값"
        healthCheckGracePeriod:
