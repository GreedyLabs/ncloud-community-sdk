openapi: 3.0.3
info:
  title: nas
  description: VPC NAS 관련 API
  version: 1.0.0
  x-ncloud-availability:
    public: true
    financial: true
    gov: true

  x-ncloud-nrn:

    productName: VPCNAS
    resource_types:
      - Volume
      - CIFS

servers:
  - url: https://ncloud.apigw.ntruss.com/vnas/v2
    description: nas 민간
    x-ncloud-env: public
  - url: https://ncloud.apigw.fin-ntruss.com/vnas/v2
    description: nas 금융
    x-ncloud-env: financial
  - url: https://ncloud.apigw.gov-ntruss.com/vnas/v2
    description: nas 공공
    x-ncloud-env: gov
security:
