components:
  schemas:
    AccessControlRuleParameter:
      type: object
      properties:
        serverInstanceNo:
          type: string
          description: "서버인스턴스 번호"
        writeAccess:
          type: string
          description: "WriteAccess 여부"
    AddNasVolumeAccessControlRequest:
      type: object
      properties:
        regionCode:
          type: string
          description: "REGION 코드"
        nasVolumeInstanceNo:
          type: string
          description: "NAS 볼륨인스턴스 번호"
        serverInstanceNoList:
          type: array
          description: "서버인스턴스 번호 리스트"
          items:
            type: string
        accessControlRuleList:
          type: array
          description: "접근제어 Rule 리스트"
          items:
            $ref: '#/components/schemas/AccessControlRuleParameter'
    AddNasVolumeAccessControlResponse:
      type: object
      properties:
        requestId:
          type: string
        returnCode:
          type: string
        returnMessage:
          type: string
        totalRows:
          type: integer
          format: int32
        nasVolumeInstanceList:
          type: array
          items:
            $ref: '#/components/schemas/NasVolumeInstance'
    ChangeNasVolumeSizeRequest:
      type: object
      properties:
        regionCode:
          type: string
          description: "REGION 코드"
        nasVolumeInstanceNo:
          type: string
          description: "NAS 볼륨인스턴스 번호"
        volumeSize:
          type: integer
          format: int32
          description: "볼륨사이즈"
        isAsync:
          type: boolean
          description: "Async 여부"
    ChangeNasVolumeSizeResponse:
      type: object
      properties:
        requestId:
          type: string
        returnCode:
          type: string
        returnMessage:
          type: string
        totalRows:
          type: integer
          format: int32
        nasVolumeInstanceList:
          type: array
          items:
            $ref: '#/components/schemas/NasVolumeInstance'
    ChangeNasVolumeSnapshotConfigurationRequest:
      type: object
      properties:
        regionCode:
          type: string
          description: "REGION 코드"
        nasVolumeInstanceNo:
          type: string
          description: "NAS 볼륨인스턴스 번호"
        snapshotVolumeConfigurationRatio:
          type: integer
          format: int32
          description: "스냅샷볼륨설정비율"
        snapshotVolumeConfigDayOfWeekTypeCode:
          type: string
          description: "스냅샷자동생성주기요일"
        snapshotVolumeConfigTime:
          type: integer
          format: int32
          description: "스냅샷자동생성주기시각"
    ChangeNasVolumeSnapshotConfigurationResponse:
      type: object
      properties:
        requestId:
          type: string
        returnCode:
          type: string
        returnMessage:
          type: string
        totalRows:
          type: integer
          format: int32
        nasVolumeInstanceList:
          type: array
          items:
            $ref: '#/components/schemas/NasVolumeInstance'
    CommonCode:
      type: object
      properties:
        code:
          type: string
          description: "코드"
        codeName:
          type: string
          description: "코드명"
    CreateNasVolumeInstanceRequest:
      type: object
      properties:
        regionCode:
          type: string
          description: "REGION 코드"
        zoneCode:
          type: string
          description: "ZONE 코드"
        volumeName:
          type: string
          description: "볼륨 이름"
        volumeSize:
          type: integer
          format: int32
          description: "볼륨사이즈"
        volumeAllotmentProtocolTypeCode:
          type: string
          description: "볼륨할당프로토콜유형 코드"
        serverInstanceNoList:
          type: array
          description: "서버인스턴스 번호 리스트"
          items:
            type: string
        cifsUserName:
          type: string
          description: "CIFS 유저이름"
        cifsUserPassword:
          type: string
          description: "CIFS 유저비밀번호"
        isEncryptedVolume:
          type: boolean
          description: "볼륨암호화여부"
        isReturnProtection:
          type: boolean
          description: "반납보호여부"
        nasVolumeDescription:
          type: string
          description: "NAS 볼륨설명"
        accessControlRuleList:
          type: array
          description: "접근제어 Rule 리스트"
          items:
            $ref: '#/components/schemas/AccessControlRuleParameter'
        isAsync:
          type: boolean
          description: "Async 여부"
    CreateNasVolumeInstanceResponse:
      type: object
      properties:
        requestId:
          type: string
        returnCode:
          type: string
        returnMessage:
          type: string
        totalRows:
          type: integer
          format: int32
        nasVolumeInstanceList:
          type: array
          items:
            $ref: '#/components/schemas/NasVolumeInstance'
    CreateNasVolumeSnapshotRequest:
      type: object
      properties:
        regionCode:
          type: string
          description: "REGION 코드"
        nasVolumeInstanceNo:
          type: string
          description: "NAS 볼륨인스턴스 번호"
    CreateNasVolumeSnapshotResponse:
      type: object
      properties:
        requestId:
          type: string
        returnCode:
          type: string
        returnMessage:
          type: string
