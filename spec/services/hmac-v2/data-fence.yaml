openapi: 3.0.3
info:
  title: data-fence
  description: data-fence
  version: 1.0.0
  x-ncloud-availability:
    public: true
    financial: false
    gov: false

  x-ncloud-nrn-todo: true
servers:
  - url: https://datafence.apigw.ntruss.com
    description: data-fence 민간
    x-ncloud-env: public
security:
  - ncpAccessKey: []
    ncpTimestamp: []
    ncpHmacV2: []
paths:
  /box/change-box-block-external-network:
    post:
      operationId: ChangeBoxBlockExternalNetwork
      summary: change-box-block-external-network
      description: VPC 환경에서 이용 가능합니다.
      tags:
        - data-fence

      x-ncloud-source: https://api.ncloud-docs.com/docs/change-box-block-external-network
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fenceId
                - boxId
                - isBlock
              properties:
                fenceId:
                  type: integer
                  description: Datafence 번호 get-data-fence 참조
                boxId:
                  type: integer
                  description: Box 번호 get-box-list 참조
                isBlock:
                  type: boolean
                  description: '외부망 연결 차단 여부 true | false true : 차단 false : 허용'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: API 처리 결과 메시지
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
  /box/change-box-infra:
    post:
      operationId: ChangeBoxInfra
      summary: change-box-infra
      description: VPC 환경에서 이용 가능합니다.
      tags:
        - data-fence

      x-ncloud-source: https://api.ncloud-docs.com/docs/change-box-infra
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fenceId
                - updateBoxInfo
                - actionType
              properties:
                fenceId:
                  type: integer
                  description: Datafence 번호 get-data-fence 참조
                updateBoxInfo:
                  type: object
                  additionalProperties: true
                  description: Box 수정 정보
                actionType:
                  type: string
                  description: '처리 유형 CREATE | UPDATE | DELETE CREATE : 생성 UPDATE : 수정 DELETE : 반납'
                serverInstanceNo:
                  type: string
                  description: Connect 서버 인스턴스 번호 get-box-infra-list 참조 actionType 이 UPDATE 또는 DELETE 인 경우, 필수 입력
                blockStorageInstanceNo:
                  type: string
                  description: Connect 서버 블록 스토리지 인스턴스 번호 get-box-infra-list 참조 actionType 이 UPDATE 또는 DELETE 인 경우, 필수 입력
                specCode:
                  type: string
                  description: Connect 서버 스펙 코드 actionType 이 CREATE 또는 UPDATE 인 경우, 필수 입력 get-product-spec 참조
                storageSize:
                  type: integer
                  description: Connect 서버 블록 스토리지 크기(GB) actionType 이 CREATE 또는 UPDATE 인 경우, 필수 입력 10~2000 10GB 단위로 설정
                userPassword1:
                  type: string
                  description: "Connect 서버 ncp1 계정 비밀번호 영문 대문자, 소문자, 숫자, 특수 문자를 각각 1자 이상 조합하여 8~14자 이내로 입력 사용 불가 특수 문자: ', \", `, ₩, /, &, $, 공백"
                userPassword2:
                  type: string
                  description: "Connect 서버 ncp2 계정 비밀번호 영문 대문자, 소문자, 숫자, 특수 문자를 각각 1자 이상 조합하여 8~14자 이내로 입력 사용 불가 특수 문자: ', \", `, ₩, /, &, $, 공백"
                softwareCode:
                  type: string
                  description: Linux 서버 소프트웨어 코드 actionType 이 CREATE 또는 UPDATE 인 경우, 필수 입력
                userPassword:
                  type: string
                  description: "Linux 서버 계정 비밀번호 영문 대문자, 소문자, 숫자, 특수 문자를 각각 1자 이상 조합하여 8~14자 이내로 입력 사용 불가 특수 문자: ', \", `, ₩, /, &, $, 공백"
                nasInstanceNo:
                  type: string
                  description: NAS 인스턴스 번호 get-box-infra-list 참조 actionType 이 DELETE 인 경우, 필수 입력
                nasSize:
                  type: integer
                  description: NAS 볼륨 크기(GB) 500~10000 100GB 단위로 설정
                count:
                  type: integer
                  description: NAS 개수 actionType 이 CREATE 인 경우, 필수 입력
                hadoopClusterNo:
                  type: string
                  description: Hadoop 클러스터 번호 get-box-infra-list 참조 infraType 이 HD 인 인프라의 instanceNo 입력 actionType 이 UPDATE 또는 DELETE 인 경우, 필수 입력
                edgeNodeSpecCode:
                  type: string
                  description: 엣지 노드 스펙 코드 get-product-spec 참조 actionType 이 CREATE 또는 UPDATE 인 경우, 필수 입력
                masterNodeSpecCode:
                  type: string
                  description: 마스터 노드 스펙 코드 get-product-spec 참조 actionType 이 CREATE 또는 UPDATE 인 경우, 필수 입력
                masterNodeStorageSize:
                  type: integer
                  description: 마스터 노드 블록스토리지 크기(GB) actionType 이 CREATE 인 경우, 필수 입력 100~2000 10GB 단위로 설정 4000GB, 6000GB도 사용 가능
                workerNodeSpecCode:
                  type: string
                  description: 워커 노드 스펙 코드 get-product-spec 참조 actionType 이 CREATE 또는 UPDATE 인 경우, 필수 입력
                workerNodeStorageSize:
                  type: integer
                  description: 워커 노드 블록스토리지 크기(GB) actionType 이 CREATE 인 경우, 필수 입력 100~2000 10GB 단위로 설정 4000GB, 6000GB도 사용 가능
                workerNodeCount:
                  type: integer
                  description: 워커 노드 개수 actionType 이 CREATE 또는 UPDATE 인 경우, 필수 입력
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: API 처리 결과 메시지
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
  /box/change-box-nas-volume:
    post:
      operationId: ChangeBoxNasVolume
      summary: change-box-nas-volume
      description: VPC 환경에서 이용 가능합니다.
      tags:
        - data-fence

      x-ncloud-source: https://api.ncloud-docs.com/docs/change-box-nas-volume
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fenceId
                - boxId
                - instanceNo
                - volumeSize
              properties:
                fenceId:
                  type: integer
                  description: Datafence 번호 get-data-fence 참조
                boxId:
                  type: integer
                  description: Box 번호 get-box-list 참조
                instanceNo:
                  type: integer
                  description: NAS 인스턴스 번호 get-box-infra-list 참조
                volumeSize:
                  type: integer
                  description: NAS 볼륨 크기(GB) 500~10000 100GB 단위로 설정
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: API 처리 결과 메시지
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
  /box/create-box:
    post:
      operationId: CreateBox
      summary: create-box
      description: VPC 환경에서 이용 가능합니다.
      tags:
        - data-fence

      x-ncloud-source: https://api.ncloud-docs.com/docs/create-box
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fenceId
                - createBoxInfo
                - specCode
                - storageSize
                - userPassword
              properties:
                fenceId:
                  type: integer
                  description: Datafence 번호 get-data-fence 참조
                description:
                  type: string
                  description: Box에 대한 설명
                createBoxInfo:
                  type: object
                  additionalProperties: true
                  description: Box 생성 정보
                specCode:
                  type: string
                  description: Connect 서버 스펙 코드 get-product-spec 참조
                softwareCode:
                  type: string
                  description: Connect 서버 소프트웨어 코드 get-product-spec 참조
                storageSize:
                  type: integer
                  description: Connect 서버 블록 스토리지 크기(GB) 10~2000 10GB 단위로 설정
                userPassword1:
                  type: string
                  description: "Connect 서버 ncp1 계정 비밀번호 영문 대문자, 소문자, 숫자, 특수 문자를 각각 1자 이상 조합하여 8~14자 이내로 입력 사용 불가 특수 문자: ', \", `, ₩, /, &, $, 공백"
                userPassword2:
                  type: string
                  description: "Connect 서버 ncp2 계정 비밀번호 영문 대문자, 소문자, 숫자, 특수 문자를 각각 1자 이상 조합하여 8~14자 이내로 입력 사용 불가 특수 문자: ', \", `, ₩, /, &, $, 공백"
                userPassword:
                  type: string
                  description: "Linux 서버 계정 비밀번호 영문 대문자, 소문자, 숫자, 특수 문자를 각각 1자 이상 조합하여 8~14자 이내로 입력 사용 불가 특수 문자: ', \", `, ₩, /, &, $, 공백"
                nasSize:
                  type: integer
                  description: NAS 볼륨 크기(GB) 500~10000 100GB 단위로 설정
                count:
                  type: integer
                  description: NAS 개수
                EdgeNodeSpecCode:
                  type: string
                  description: 엣지 노드 스펙 코드 get-product-spec 참조
                masterNodeSpecCode:
                  type: string
                  description: 마스터 노드 스펙 코드 get-product-spec 참조
                masterNodeStorageSize:
                  type: integer
                  description: 마스터 노드 블록스토리지 크기(GB) 100~2000 10GB 단위로 설정
                workerNodeSpecCode:
                  type: string
                  description: 워커 노드 스펙 코드 get-product-spec 참조
                workerNodeCount:
                  type: integer
                  description: 워커 노드 개수
                workerNodeStorageSize:
                  type: integer
                  description: 워커 노드 블록스토리지 크기(GB) 100~2000 10GB 단위로 설정
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: API 처리 결과 메시지
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
  /box/get-box-custom-image:
    get:
      operationId: GetBoxCustomImage
      summary: get-box-custom-image
      description: VPC 환경에서 이용 가능합니다.
      tags:
        - data-fence

      x-ncloud-source: https://api.ncloud-docs.com/docs/get-box-custom-image
      parameters:
        - name: fenceId
          in: query
          required: true
          schema:
            type: integer
          description: Datafence 번호 get-data-fence 참조
        - name: productCode
          in: query
          required: true
          schema:
            type: string
          description: 'Box 스펙 코드 CON | TF_CPU | TF_GPU | SVR_LNX_UBUNTU | SVR_WIN CON : Connect 서버 TF_CPU : Tensorflow 서버(CPU) TF_GPU : Tensorflow 서버(GPU) SVR_LNX_UBUNTU : Linux 서버(Ubuntu) SVR_WIN : Windows 서버'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                    description: '사용자 서버 이미지 정보: content'
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
  /box/get-box-history:
    get:
      operationId: GetBoxHistory
      summary: get-box-history
      description: VPC 환경에서 이용 가능합니다.
      tags:
        - data-fence

      x-ncloud-source: https://api.ncloud-docs.com/docs/get-box-history
      parameters:
        - name: fenceId
          in: query
          required: true
          schema:
            type: integer
          description: Datafence 번호
        - name: page
          in: query
          required: false
          schema:
            type: integer
          description: 페이지 번호 0~100
        - name: size
          in: query
          required: false
          schema:
            type: integer
          description: 페이지당 항목 수 1~100
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalCount:
                    type: integer
                    description: 응답 결과 수
                  content:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                    description: 'Box 이력 목록: content'
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
  /box/get-box-infra-history:
    get:
      operationId: GetBoxInfraHistory
      summary: get-box-infra-history
      description: VPC 환경에서 이용 가능합니다.
      tags:
