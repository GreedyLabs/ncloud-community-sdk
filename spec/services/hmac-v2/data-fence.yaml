            type: integer
          description: Datafence 번호 get-data-fence 참조
        - name: boxId
          in: query
          required: true
          schema:
            type: integer
          description: Box 번호 get-box-list 참조
        - name: page
          in: query
          required: false
          schema:
            type: integer
          description: '페이지 번호 0~100 (기본값: 0)'
        - name: size
          in: query
          required: false
          schema:
            type: integer
          description: '페이지당 항목 수 1~100 (기본값: 10)'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
