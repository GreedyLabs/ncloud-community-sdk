        5XX:
          $ref: '#/components/responses/NcloudServerError'
  /box/get-box-summary-info:
    get:
      operationId: GetBoxSummaryInfo
      summary: get-box-summary-info
      description: VPC 환경에서 이용 가능합니다.
      tags:
        - data-fence

      x-ncloud-source: https://api.ncloud-docs.com/docs/get-box-summary-info
      parameters:
        - name: fenceId
          in: query
          required: true
          schema:
            type: integer
          description: Datafence 번호 get-data-fence 참조
        - name: boxId
          in: query
          required: true
          schema:
            type: integer
          description: Box 번호 get-box-list 참조
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  boxId:
                    type: integer
                    description: Box 번호
                  boxName:
                    type: string
                    description: Box 이름
                  description:
                    type: string
                    description: Box에 대한 설명
                  mountCount:
                    type: integer
                    description: 'Box 상태 코드 INITIALIZE | USE | ING | RETURN | TERMINATE INITIALIZE : 인프라 생성 중 USE : 이용 중 ING : 변경 중 RETURN : 반납 중 TERMINATE : 반납 완료'
                  nasCount:
                    type: integer
                    description: Box 저장소의 개수
                  nasTotalSize:
                    type: integer
                    description: Box 저장소의 총 용량(GB)
                  nasInstanceNoList:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                    description: NAS 인스턴스 번호 목록
                  nasTotalUseSize:
                    type: integer
                    description: Box 저장소의 총 사용량(GB)
                  exportApplyCount:
                    type: integer
                    description: 반출 심사 요청 횟수
                  webBlockStatus:
                    type: boolean
                    description: '외부망 차단 여부 true | false true : 차단 false : 연결'
                  statusCode:
                    type: string
                    description: 'Box 상태 코드 INITIALIZE | USE | ING | RETURN | TERMINATE INITIALIZE : 인프라 생성 중 USE : 이용 중 ING : 변경 중 RETURN : 반납 중 TERMINATE : 반납 완료'
                  statusName:
                    type: string
                    description: Box 상태 이름 인프라 생성중 | 이용중 | 변경 중 | 반납중 | 반납완료
                  createDate:
                    type: string
                    description: Box 생성 일시 ISO 8601 형식(UTC+9 포함)
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
  /box/get-connect-info:
    get:
      operationId: GetConnectInfo
      summary: get-connect-info
      description: VPC 환경에서 이용 가능합니다.
      tags:
        - data-fence

      x-ncloud-source: https://api.ncloud-docs.com/docs/get-connect-info
      parameters:
        - name: fenceId
          in: query
          required: true
