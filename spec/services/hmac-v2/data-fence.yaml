  /box/get-box-list:
    get:
      operationId: GetBoxList
      summary: get-box-list
      description: VPC 환경에서 이용 가능합니다.
      tags:
        - data-fence

      x-ncloud-source: https://api.ncloud-docs.com/docs/get-box-list
      parameters:
        - name: fenceId
          in: query
          required: true
          schema:
            type: integer
