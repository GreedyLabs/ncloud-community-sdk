  /keys:
    get:
      operationId: GetProtectionKeyList
      summary: Get Protection Key List
      description: VPC 환경에서 이용 가능합니다.
      tags:
        - secret-manager

      x-ncloud-source: https://api.ncloud-docs.com/docs/secretmanager-getprotectionkeylist
      responses:
