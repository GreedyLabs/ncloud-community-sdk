openapi: 3.0.3
info:
  title: secret-manager
  description: secret-manager
  version: 1.0.0
  x-ncloud-availability:
    public: true
    financial: false
    gov: false

  x-ncloud-nrn-todo: true
servers:
  - url: https://secretmanager.apigw.ntruss.com
    description: secret-manager 민간
    x-ncloud-env: public
security:
  - ncpAccessKey: []
    ncpTimestamp: []
    ncpHmacV2: []
paths:
  /action/v1/secrets/{secretId}/jobs/{jobToken}/complete:
    post:
      operationId: CompleteRotationJob
      summary: Complete Rotation Job
      description: VPC 환경에서 이용 가능합니다.
      tags:
        - secret-manager

      x-ncloud-source: https://api.ncloud-docs.com/docs/secretmanager-complete-rotation-job
      parameters:
        - name: secretId
          in: path
          required: true
          schema:
            type: string
          description: 시크릿 아이디 Get Secret List 또는 Get Secret Logs 참조 트리거를 실행한 애플리케이션에 자동 주입되며, 환경 변수로 확인 가능 시크릿 교체 액션 예제 코드 참조
        - name: jobToken
          in: path
          required: true
          schema:
            type: string
          description: 작업 토큰 Get Secret Logs 참조 트리거를 실행한 애플리케이션에 자동 주입되며, 환경 변수로 확인 가능 시크릿 교체 액션 예제 코드 참조
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: 응답 코드
                  data:
                    type: string
                    description: 응답 결과 성공 시 null 표시
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
  /action/v1/secrets/{secretId}/jobs/{jobToken}/fail:
    post:
      operationId: FailRotationJob
      summary: Fail Rotation Job
      description: VPC 환경에서 이용 가능합니다.
      tags:
        - secret-manager

      x-ncloud-source: https://api.ncloud-docs.com/docs/secretmanager-fail-rotation-job
      parameters:
        - name: secretId
          in: path
          required: true
          schema:
            type: string
          description: 시크릿 아이디 Get Secret List 또는 Get Secret Logs 참조 트리거를 실행한 애플리케이션에 자동 주입되며, 환경 변수로 확인 가능 시크릿 교체 액션 예제 코드 참조
        - name: jobToken
          in: path
          required: true
          schema:
            type: string
          description: 작업 토큰 Get Secret Logs 참조 트리거를 실행한 애플리케이션에 자동 주입되며, 환경 변수로 확인 가능 시크릿 교체 액션 예제 코드 참조
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: 응답 코드
                  data:
                    type: string
                    description: 응답 결과 성공 시 null 표시
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
  /action/v1/secrets/{secretId}/jobs/{jobToken}/generate-random-secret:
    post:
      operationId: GenerateRandomSecret
      summary: Generate Random Secret
      description: VPC 환경에서 이용 가능합니다.
      tags:
        - secret-manager

      x-ncloud-source: https://api.ncloud-docs.com/docs/secretmanager-generate-random-secret
      parameters:
        - name: secretId
          in: path
          required: true
          schema:
            type: string
          description: 시크릿 아이디 Get Secret List 또는 Get Secret Logs 참조 트리거를 실행한 애플리케이션에 자동 주입되며, 환경 변수로 확인 가능 시크릿 교체 액션 예제 코드 참조
        - name: jobToken
          in: path
          required: true
          schema:
            type: string
          description: 작업 토큰 Get Secret Logs 참조 트리거를 실행한 애플리케이션에 자동 주입되며, 환경 변수로 확인 가능 시크릿 교체 액션 예제 코드 참조
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - length
              properties:
                length:
                  type: integer
                  description: '랜덤 문자열 길이(자) 5~32 (기본값: 12)'
                excludeCharacters:
                  type: string
                  description: 제외 문자들 여러 개인 경우, 구분자 없이 하나의 문자열로 이어서 나열
                excludeNumbers:
                  type: boolean
                  description: '숫자 제외 여부 true | false (기본값) true : 제외 false : 제외 안 함'
                excludePunctuation:
                  type: boolean
                  description: '특수 문자 제외 여부 true | false (기본값) true : 제외 false : 제외 안 함'
                excludeUppercase:
                  type: boolean
                  description: '대문자 제외 여부 true | false (기본값) true : 제외 false : 제외 안 함'
                excludeLowercase:
                  type: boolean
                  description: '소문자 제외 여부 true | false (기본값) true : 제외 false : 제외 안 함'
                includeSpace:
                  type: boolean
                  description: '공백 포함 여부 true (기본값) | false true : 포함 false : 포함 안 함'
                requireEachIncludedType:
                  type: boolean
                  description: '제외하지 않은 문자 유형(대문자, 소문자, 숫자, 특수 문자, 공백) 모두 포함 여부 true (기본값) | false true : 모두 포함 false : 모두 포함 안 함'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  randomString:
                    type: string
                    description: 랜덤 문자열
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
  /action/v1/secrets/{secretId}/jobs/{jobToken}/pending:
    post:
      operationId: AddPendingStage
      summary: Add Pending Stage
      description: VPC 환경에서 이용 가능합니다.
