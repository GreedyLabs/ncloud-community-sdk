  /secrets:
    get:
      operationId: GetSecretList
      summary: Get Secret List
      description: VPC 환경에서 이용 가능합니다.
      tags:
        - secret-manager

      x-ncloud-source: https://api.ncloud-docs.com/docs/secretmanager-getsecretlist
      parameters:
        - name: pageNo
          in: query
          required: false
          schema:
            type: integer
          description: '페이지 번호 1~N (기본값: 1)'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: 응답 코드
                  data:
                    type: object
                    additionalProperties: true
                    description: 응답 결과
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
    post:
      operationId: CreateSecret
      summary: Create Secret
      description: VPC 환경에서 이용 가능합니다.
      tags:
        - secret-manager

      x-ncloud-source: https://api.ncloud-docs.com/docs/secretmanager-createsecret
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - secretName
                - secretValue
                - secretType
                - autoRotationYN
                - protectionKeyType
              properties:
                secretName:
                  type: string
                  description: 시크릿 이름 영문자, 숫자, 특수 문자 '-', '_'를 허용하며, 3~15자 이내로 입력 문자열의 시작은 영문자
                memo:
                  type: string
                  description: 시크릿 설명(Byte) 0~1000
                secretValue:
                  type: object
                  additionalProperties: true
                  description: 시크릿 값 객체
                secretType:
                  type: string
                  description: '시크릿 타입 BASIC : 기본 시크릿 타입 (유효값)'
                autoRotationYN:
                  type: string
                  description: '자동 교체 여부 Y | N (기본값) Y : 자동 교체 N : 자동 교체 안 함'
                autoRotationPeriod:
                  type: integer
                  description: '시크릿 자동 교체 주기(일) 1~730 (기본값: 90) autoRotationYN 이 Y 인 경우, 필수 입력'
                triggerId:
                  type: string
                  description: 트리거 아이디 Get Trigger List 참조 autoRotationYN 이 Y 인 경우, 필수 입력
                protectionKeyType:
                  type: string
                  description: '보호 키 타입 DEFAULT (기본값) | USER_MANAGED_KEY DEFAULT : 기본 키 USER_MANAGED_KEY : 사용자 관리 키'
                kmsKeyTag:
                  type: string
                  description: KMS 키 태그 Get Protection Key List 참조 protectionKeyType 이 USER_MANAGED_KEY 인 경우, 필수 입력
                kmsBoundaryType:
                  type: string
                  description: 'KMS 리전 격리 타입 GLOBAL | ISOLATED GLOBAL : 전역 ISOLATED : 격리 신규 키 생성은 ISOLATED 만 지원'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: 응답 코드
                  data:
                    type: object
                    additionalProperties: true
                    description: 응답 결과
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
