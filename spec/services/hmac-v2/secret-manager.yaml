      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: 응답 코드
                  data:
                    type: object
                    additionalProperties: true
                    description: 응답 결과
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
    put:
      operationId: UpdatePendingStage
      summary: Update Pending Stage
      description: VPC 환경에서 이용 가능합니다.
      tags:
        - secret-manager

      x-ncloud-source: https://api.ncloud-docs.com/docs/secretmanager-update-pending-stage
      parameters:
        - name: secretId
          in: path
          required: true
          schema:
            type: string
          description: 시크릿 아이디 Get Secret List 또는 Get Secret Logs 참조 트리거를 실행한 애플리케이션에 자동 주입되며, 환경 변수로 확인 가능 시크릿 교체 액션 예제 코드 참조
        - name: jobToken
          in: path
          required: true
          schema:
            type: string
          description: 작업 토큰 Get Secret Logs 참조 트리거를 실행한 애플리케이션에 자동 주입되며, 환경 변수로 확인 가능 시크릿 교체 액션 예제 코드 참조
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - value
              properties:
                value:
                  type: string
                  description: 시크릿 값 JSON 형식
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: 응답 코드
                  data:
                    type: object
                    additionalProperties: true
                    description: 응답 결과
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
