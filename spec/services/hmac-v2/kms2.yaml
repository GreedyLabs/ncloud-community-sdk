            type: boolean
          description: '암호화된 임의의 평문 생성 여부 true | false (기본값) true : 생성 false : 미생성'
        - name: bits
          in: query
          required: false
          schema:
            type: integer
          description: 생성할 키 데이터 크기(비트) 128 | 256 (기본값) | 512
        - name: context
          in: query
          required: false
          schema:
            type: string
          description: Base64로 인코딩된 문자열 데이터 수렴 암호화(convergent encryption)가 적용된 키 사용 시 필수 입력 최대 50 바이트 입력 가능 같은 데이터를 여러 번 암호화하더라도 항상 동일한 암호문 생성
      responses:
