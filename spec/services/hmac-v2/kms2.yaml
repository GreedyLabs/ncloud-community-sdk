                  data:
                    type: object
                    additionalProperties: true
                    description: 응답 결과 값은 null 로 표시
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
  /kms/v1/keys/{keyTag}/access-token:
    post:
      operationId: TokenAccessToken
