openapi: 3.0.3
info:
  title: kms2
  description: kms2
  version: 1.0.0
  x-ncloud-availability:
    public: true
    financial: false
    gov: true

  x-ncloud-nrn:

    productName: KMS
    resource_types:
      - Key

# Real base URL is ocapi.ncloud.com (verified live 2026-04-26 against the
# curl example in https://api.ncloud-docs.com/docs/security-kms2-key-list).
# An earlier "fix" in this file pointed at kms.apigw.ntruss.com/api/v1 — that
# host responded but with an UNRELATED keystore service (different from kms2).
# Region-isolated variants ocapi-kr.ncloud.com / ocapi-jp.ncloud.com also
# documented but flaky/timeout from outside KR; keep them as alt servers
# for completeness. Auth is normal HMAC v2.
servers:
  - url: https://ocapi.ncloud.com
    description: kms2 전역(GLOBAL)
    x-ncloud-env: public
  - url: https://ocapi-kr.ncloud.com
    description: kms2 격리 — 한국(KR)
    x-ncloud-env: public
    x-ncloud-region: KR
  - url: https://ocapi-jp.ncloud.com
    description: kms2 격리 — 일본(JP)
    x-ncloud-env: public
    x-ncloud-region: JP
security:
  - ncpAccessKey: []
    ncpTimestamp: []
    ncpHmacV2: []
paths:
  /kms/v1/keys:
    get:
      operationId: KeyList
      summary: Get Key List
      description: Classic/VPC 환경에서 이용 가능합니다.
      tags:
        - kms2

      x-ncloud-source: https://api.ncloud-docs.com/docs/security-kms2-key-list
      parameters:
        - name: pageNo
          in: query
          required: false
          schema:
            type: integer
          description: 요청 페이지 번호 1 (기본값)
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
          description: '페이지 출력 개수 1~200 (기본값: 100)'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: 성공 여부
                  data:
                    type: object
                    additionalProperties: true
                    description: 응답 결과
                  currentPageNo:
                    type: integer
                    description: 현재 페이지 번호
                  totalPageNo:
                    type: integer
                    description: 총 페이지 번호
                  totalCount:
                    type: integer
                    description: 응답 결과 개수
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
    post:
      operationId: CreateKey
      summary: Create Key
      description: Classic/VPC 환경에서 이용 가능합니다.
      tags:
        - kms2

      x-ncloud-source: https://api.ncloud-docs.com/docs/security-kms2-create-key
      parameters:
        - name: keyName
          in: query
          required: true
          schema:
            type: string
          description: 키 이름 영문자, 숫자, 특수문자 '-', '_'를 조합하여 3~15자 이내로 입력 첫 글자는 영문이어야 하며 사용자의 키 저장소 내 다른 키 이름과 중복 불가
        - name: keyType
          in: query
          required: true
          schema:
            type: string
          description: '키 타입 AES256 | RSA2048 | ECDSA AES256 : 대칭키 방식의 AES 암호(AES 256-GCM96)를 사용하는 256 비트 키 최대 32 KB의 데이터 암호화 가능 RSA2048 : 비대칭키 방식의 RSA 암호(RSA 2048)를 사용하는 2048 비트 키 암호화ㆍ복호화, 서명ㆍ검증 기능을 모두 사용할 수 있으나 처리 속도가 가장 느림 최대 190 바이트 데이터 암호화 또는 최대 8 KB 데이터 서명 가능 ECDSA : 비대칭키 방식의 ECDSA 암호(ECDSA-P256)를 사용하는 256 비트 키 최대 8 KB의 데이터 서명 가능'
        - name: memo
          in: query
          required: false
          schema:
            type: string
          description: 키 메모 키에 대한 추가 정보 및 설명 0~100자 입력 가능
        - name: isConvergent
          in: query
          required: false
          schema:
            type: boolean
          description: '수렴 암호화(convergent encryption) 설정 여부 true | false (기본값) true : 설정 false : 미설정 keyType 이 AES256 인 경우에만 설정 가능'
        - name: isAutoRotation
          in: query
          required: true
          schema:
            type: boolean
          description: '키 자동 회전 활성화 여부 true | false (기본값) true : 활성화 false : 비활성화'
        - name: rotationPeriod
          in: query
          required: false
          schema:
            type: integer
          description: '키 자동 회전 주기 설정(일) 1~730 (기본값: 90) isAutoRotation 이 true 인 경우 입력 가능'
        - name: protectionType
          in: query
          required: true
          schema:
            type: string
          description: '키 저장 방식 BASIC | COMMON_HSM BASIC : 내부 스토리지에 암호화된 형태로 저장 COMMON_HSM : HSM (Hardware Security Module)에 저장'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: 성공 여부
                  data:
                    type: object
                    additionalProperties: true
                    description: 응답 결과
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
  /kms/v1/keys/{keyTag}:
