        - name: accessTokenHours
          in: query
          required: false
          schema:
            type: string
          description: '액세스 토큰 유효 시간(시간) 1~17520 (기본값: 72) UL : 무제한 설정 시 입력'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: 성공 여부
                  data:
                    type: object
                    additionalProperties: true
                    description: 응답 결과
        4XX:
