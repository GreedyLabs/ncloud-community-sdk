openapi: 3.0.3
info:
  title: Naver CLUE
  description: Naver CLUE
  version: 1.0.0
  x-ncloud-availability:
    public: true
    financial: false
    gov: false

  x-ncloud-nrn-todo: true
servers:
  - url: https://nclue.apigw.ntruss.com/api/v1
    description: nclue 민간
    x-ncloud-env: public
security:
  - ncpAccessKey: []
    ncpTimestamp: []
    ncpHmacV2: []
paths:
  /features:
    get:
      operationId: GetFeatureList
      summary: Feature 목록 조회
      description: VPC 환경에서 이용 가능합니다.
      tags:
        - nclue

      x-ncloud-source: https://api.ncloud-docs.com/docs/nclue-getfeaturelist
      parameters:
        - name: index
          in: query
          required: false
          schema:
            type: integer
          description: '목록 시작 위치 기본값: 0'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
          description: '목록 출력 제한 값 1~100 (기본값: 20)'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  index:
                    type: integer
                    description: 목록 시작 위치
                  limit:
                    type: integer
                    description: 목록 출력 제한 값
                  total:
                    type: integer
                    description: 조회된 Feature 개수
                  features:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                    description: 'Feature 목록: features'
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
    post:
      operationId: PostFeature
      summary: Feature 생성
      description: VPC 환경에서 이용 가능합니다.
      tags:
        - nclue

      x-ncloud-source: https://api.ncloud-docs.com/docs/nclue-postfeature
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - source_bucket
                - source_file_path
              properties:
                name:
                  type: string
                  description: Feature 이름 1~100자
                source_bucket:
                  type: string
                  description: 시퀀스 데이터셋 파일이 저장된 Object Storage 버킷 이름
                source_file_path:
                  type: string
                  description: source_bucket 내 시퀀스 데이터셋 파일 경로 다음 특수 문자가 포함된 파일 경로는 입력 불가 &$@;:+,?*\{}^%`[]<>~#|"' ASCII 코드가 0~31, 128~255인 문자 공백(스페이스) 파일이 여러 개 있는 경우, 디렉토리 경로 입력(Hadoop 작업으로 데이터가 디렉토리 단위로 사용될 때)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  feature_id:
                    type: string
                    description: Feature ID
                  feature_name:
                    type: string
                    description: Feature 이름
                  created_at:
                    type: string
                    description: Feature 생성 요청 일시 ISO 8601 형식
                  source_bucket:
                    type: string
                    description: 시퀀스 데이터셋 파일이 저장된 Object Storage 버킷 이름
                  source_file_path:
                    type: string
                    description: source_bucket 내 시퀀스 데이터셋 파일 경로
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
  /features/{feature_id}:
    get:
      operationId: GetFeature
      summary: Feature 조회
      description: VPC 환경에서 이용 가능합니다.
      tags:
        - nclue

      x-ncloud-source: https://api.ncloud-docs.com/docs/nclue-getfeature
      parameters:
        - name: feature_id
          in: path
          required: true
          schema:
            type: string
          description: Feature ID Feature 목록 조회 참조
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  feature_id:
                    type: string
                    description: Feature ID
                  feature_name:
                    type: string
                    description: Feature 이름
                  status:
                    type: string
                    description: 'Feature 상태 registered | pending | in_progress | completed | failed registered : 등록됨 pending : 대기 중 in_progress : 생성 중 completed : 사용 가능 failed : 실패'
                  created_at:
                    type: string
                    description: Feature 생성 요청 일시(ISO 8601 형식)
                  completed_at:
                    type: string
                    description: Feature 생성 완료 일시(ISO 8601 형식)
                  source_bucket:
                    type: string
                    description: 시퀀스 데이터셋 파일이 저장된 Object Storage 버킷 이름
                  source_file_path:
                    type: string
                    description: source_bucket 내 시퀀스 데이터셋 파일 경로
                  user_count:
                    type: integer
                    description: 시퀀스 데이터셋의 사용자 수
                  token_count:
                    type: integer
                    description: 시퀀스 데이터셋의 토큰 수
                  disk_usage:
                    type: integer
                    description: Feature 용량(Byte)
                  fail_message:
                    type: string
                    description: 생성 실패 메시지 생성 실패 시 메시지를 반환하며, 성공 시에는 null 리턴 메시지별 해결 방법은 NCLUE 문제 해결 참조
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
    delete:
      operationId: DeleteFeature
      summary: Feature 삭제
      description: VPC 환경에서 이용 가능합니다.
      tags:
        - nclue

      x-ncloud-source: https://api.ncloud-docs.com/docs/nclue-deletefeature
      parameters:
        - name: feature_id
          in: path
          required: true
          schema:
            type: string
          description: Feature ID Feature 목록 조회 참조
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  feature_id:
                    type: string
                    description: Feature ID
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
  /profile/custom-attributes:
    get:
      operationId: GetCustomAttributesList
      summary: Custom Attributes 목록 조회
      description: VPC 환경에서 이용 가능합니다.
