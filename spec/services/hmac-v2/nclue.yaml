          required: false
          schema:
            type: integer
          description: '목록 시작 위치 기본값: 0'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
          description: '목록 출력 제한 값 1~100 (기본값: 20)'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  index:
                    type: integer
                    description: 목록 시작 위치
                  limit:
                    type: integer
                    description: 목록 출력 제한 값
                  total:
                    type: integer
                    description: 조회된 Profile 개수
                  profiles:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                    description: 'Profile 목록: profiles'
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
    post:
      operationId: PostCustomAttributes
      summary: Custom Attributes 생성
      description: VPC 환경에서 이용 가능합니다.
      tags:
        - nclue

      x-ncloud-source: https://api.ncloud-docs.com/docs/nclue-postcustomattributes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - feature_id
                - keyword_set
                - result_bucket
                - result_file_path
              properties:
                name:
                  type: string
                  description: Profile 이름 1~100 자
                feature_id:
                  type: string
                  description: 프로파일링에 적용할 Feature ID Feature 목록 조회 참조
                keyword_set:
                  type: string
                  description: 대상 사용자와 유사도를 확인할 속성 키워드 목록 전체 키워드 총합 1,000 글자 이내 각 키워드는 '\n'으로 구분 <예시> 러닝\n 달리기\n 마라톤
                result_bucket:
                  type: string
                  description: 프로파일링 결과를 저장할 Object Storage 버킷 이름
                result_file_path:
                  type: string
                  description: 프로파일링 결과를 저장할 result_bucket 내 파일 경로 다음 특수 문자가 포함된 파일 경로는 입력 불가 &$@;:+,?*\{}^%`[]<>~#|"' ASCII 코드가 0~31, 128~255인 문자 공백(스페이스) 파일명 생성 규칙 입력 문자열이 '/'로 끝나면 디렉토리로 간주하여, 디렉토리 내부에 'nclue_{난수}_{연 월시}.tsv' 파일명으로 생성 그 외는 입력 문자열을 파일명으로 간주하여 '{입력문자열}_{난수}_{연월시}.tsv' 파일명으로 생성
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile_id:
                    type: string
                    description: Profile ID
                  profile_name:
                    type: string
                    description: Profile 이름
                  feature_id:
                    type: string
                    description: 프로파일링할 Feature ID
                  feature_name:
                    type: string
                    description: 프로파일링할 Feature 이름
                  keyword_set:
                    type: string
                    description: 속성 키워드 목록 각 키워드는 ','로 구분
                  created_at:
                    type: string
                    description: Profile 생성 요청 일시 ISO 8601 형식
                  result_bucket:
                    type: string
                    description: 프로파일링 결과를 저장할 Object Storage 버킷 이름
                  result_file_path:
                    type: string
                    description: 프로파일링 결과를 저장할 result_bucket 내 파일 경로
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
