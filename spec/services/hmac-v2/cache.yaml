openapi: 3.0.3
info:
  title: cache
  description: |-
    Cloud DB for Cache (formerly Cloud DB for Redis) — VPC.
    Rebranded by NCP in 2025-2026 (Valkey-aligned naming). NRN productCode VPCCloudDBforRedis is preserved for backward compatibility.

    Canonical API scheme: base /vcache/v2 + operations named CloudCache*.
    The legacy /vredis/v2 + CloudRedis* scheme remains active but the two cannot be mixed.

    Omitted vs the SDK: AddCloudRedisUserList, DeleteCloudRedisUserList, GetCloudRedisUserList (gov-only, undocumented under either scheme; callers needing them must fall back to the legacy /vredis/v2 path).
  version: 1.0.0
  x-ncloud-availability:
    public: true
    financial: true
    gov: true

  x-ncloud-nrn:

    productName: VPCCloudDBforRedis
    resource_types:
      - Service
      - Server
      - ConfigGroup

servers:
  - url: https://ncloud.apigw.ntruss.com/vcache/v2
    description: cache 민간
    x-ncloud-env: public
  - url: https://ncloud.apigw.fin-ntruss.com/vcache/v2
    description: cache 금융
    x-ncloud-env: financial
  - url: https://ncloud.apigw.gov-ntruss.com/vcache/v2
    description: cache 공공
    x-ncloud-env: gov
security:
  - ncpAccessKey: []
    ncpTimestamp: []
    ncpHmacV2: []
paths:
  /createCloudCacheConfigGroup:
    post:
      operationId: CreateCloudCacheConfigGroup
      tags:
        - cache
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateCloudCacheConfigGroupRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCloudCacheConfigGroupResponse'
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'

      x-ncloud-source: sdk:NaverCloudPlatform/ncloud-sdk-go-v2@6eac36b
      summary: Cloud DB for Cache Config Group을 생성합니다. Config Group에서는 생성한 Redis Server를 그룹핑하여 그룹에 속한 서버들에 동일한 설정값을 지정하여 효율적으로 관리할 수 있습니다.
  /createCloudCacheInstance:
    post:
      operationId: CreateCloudCacheInstance
      tags:
        - cache
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateCloudCacheInstanceRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCloudCacheInstanceResponse'
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'

      x-ncloud-source: sdk:NaverCloudPlatform/ncloud-sdk-go-v2@6eac36b
      summary: Cloud DB for Cache 인스턴스를 생성합니다.
  /deleteCloudCacheConfigGroup:
    post:
      operationId: DeleteCloudCacheConfigGroup
      tags:
        - cache
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeleteCloudCacheConfigGroupRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteCloudCacheConfigGroupResponse'
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'

      x-ncloud-source: sdk:NaverCloudPlatform/ncloud-sdk-go-v2@6eac36b
      summary: Cloud DB for Cache Config Group을 삭제합니다.
  /deleteCloudCacheInstance:
    post:
      operationId: DeleteCloudCacheInstance
      tags:
        - cache
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
