                  description: 스키마 이름< 영문자, 숫자, 특수 문자 '_', '-'를 조합하여 3~20자 이내로 입력 문자열의 시작은 영문자
                fields:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                  description: '스키마 필드 정보: fields'
                description:
                  type: string
                  description: 스키마에 대한 설명 0~100자
                type:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                  description: 스키마 필드의 데이터 타입 string | int | long | boolean | null
                categorical:
                  type: boolean
                  description: '범주형 필드 여부 true | false (기본값) true : 범주가 정해진 데이터 false : 범주가 정해지지 않은 데이터'
      responses:
