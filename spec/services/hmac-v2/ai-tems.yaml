                  name:
                    type: string
                    description: 스키마 이름
                  fields:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                    description: '스키마 필드 정보: fields'
                  description:
                    type: string
                    description: 스키마에 대한 설명
                  createdDate:
