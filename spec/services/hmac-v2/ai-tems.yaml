    post:
      operationId: SchemaCreate
      summary: 스키마 생성
      description: Classic/VPC 환경에서 이용 가능합니다.
      tags:
        - ai-tems

      x-ncloud-source: https://api.ncloud-docs.com/docs/ai-application-service-aitems-schema-create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - datasetType
                - name
                - fields
                - type
              properties:
                datasetType:
                  type: string
                  description: '데이터셋 타입 user | item | interaction user : 사용자 정보(연령, 성별 등)를 담은 데이터 item : 상품 관련 정보(가격, 출시일, 카테고리 등)를 담은 데이터 interaction : 사용자와 상품 간 상호작용으로 얻은 기록을 담은 데이터'
