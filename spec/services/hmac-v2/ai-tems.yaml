openapi: 3.0.3
info:
  title: AiTEMS
  description: AiTEMS
  version: 1.0.0
  x-ncloud-availability:
    public: true
    financial: false
    gov: false

  x-ncloud-nrn-todo: true
servers:
  - url: https://aitems.apigw.ntruss.com
    description: ai-tems 민간
    x-ncloud-env: public
security:
  - ncpAccessKey: []
    ncpTimestamp: []
    ncpHmacV2: []
paths:
  /datasets:
    get:
      operationId: DataSetList
      summary: 데이터셋 목록 조회
      description: Classic/VPC 환경에서 이용 가능합니다.
      tags:
        - ai-tems

      x-ncloud-source: https://api.ncloud-docs.com/docs/ai-application-service-aitems-dataset-list
      parameters:
        - name: offset
          in: query
          required: false
          schema:
            type: integer
          description: '조회 데이터의 시작 위치 기본값: 0'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
          description: '조회 데이터의 최대 개수 기본값: 1,000'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  datasets:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                    description: '데이터세 정보: datasets'
                  offset:
                    type: integer
                    description: 조회 데이터의 시작 위치
                  limit:
                    type: integer
                    description: 조회 데이터의 최대 개수
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
    post:
      operationId: DataSetCreate
      summary: 데이터셋 생성
      description: Classic/VPC 환경에서 이용 가능합니다.
      tags:
        - ai-tems

      x-ncloud-source: https://api.ncloud-docs.com/docs/ai-application-service-aitems-dataset-create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - name
                - description
                - schemaName
                - osInfo
              properties:
                type:
                  type: string
                  description: '데이터셋 타입 user | item | interaction user : 사용자 정보(연령, 성별 등)를 담은 데이터 item : 상품 관련 정보(가격, 출시일, 카테고리 등)를 담은 데이터 interaction : 사용자와 상품 간 상호작용으로 얻은 기록을 담은 데이터'
                name:
                  type: string
                  description: 데이터셋 이름 영문자, 숫자, 특수 문자 '_', '-'를 조합하여 3~20자 이내로 입력 문자열의 시작은 영문자
                description:
                  type: string
                  description: 데이터셋에 대한 설명 0~100자
                schemaName:
                  type: string
                  description: 데이터셋의 스키마 이름
                osInfo:
                  type: object
                  additionalProperties: true
                  description: 데이터 파일이 저장된 Object Storage 정보
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  datasetId:
                    type: string
                    description: 데이터셋 ID
                  type:
                    type: string
                    description: '데이터셋 타입 user | item | interaction user : 사용자 정보(연령, 성별 등)를 담은 데이터 item : 상품 관련 정보(가격, 출시일, 카테고리 등)를 담은 데이터 interaction : 사용자와 상품 간 상호작용으로 얻은 기록을 담은 데이터'
                  name:
                    type: string
                    description: 데이터셋 이름
                  description:
                    type: string
                    description: 데이터셋에 대한 설명
                  schemaName:
                    type: string
                    description: 데이터셋 스키마 이름
                  status:
                    type: string
                    description: '데이터셋 상태 enable | waiting | processing | upload_failed | disable | deleting enable : 학습 가능 waiting , processing : 대기 중 upload_failed , disable , deleting : 업로드 실패'
                  osInfo:
                    type: object
                    additionalProperties: true
                    description: 데이터 파일이 저장된 Object Storage 정보
                  connectedServices:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                    description: '데이터셋을 사용 중인 서비스 정보: connectedServices'
                  createdDate:
                    type: string
                    description: 데이터셋 생성 일시
                  updatedDate:
                    type: string
                    description: 데이터셋 최종 업데이트 일시
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
