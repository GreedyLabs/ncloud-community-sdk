      tags:
        - organization

      x-ncloud-source: https://api.ncloud-docs.com/docs/organization-post-account-reject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - masterMemberNo
                - organizationNo
              properties:
                masterMemberNo:
                  type: integer
                  description: 마스터 계정 회원 번호 마스터 계정에서 받은 정보 입력
                organizationNo:
                  type: integer
                  description: Organization 번호 마스터 계정에서 받은 정보 입력
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: API 처리 결과
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
