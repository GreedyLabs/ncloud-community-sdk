  /open-api/v1/group:
    post:
      operationId: PostGroup
      summary: 계정 그룹 생성
      description: Classic/VPC 환경에서 이용 가능합니다.
      tags:
        - organization

      x-ncloud-source: https://api.ncloud-docs.com/docs/organization-post-group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - organizationGroupName
                - upperOrganizationGroupNo
              properties:
                organizationGroupName:
                  type: string
                  description: 계정 그룹 이름 영문자, 숫자, 특수 문자 '-', '_', '.'를 조합하여 3~50자 이내로 입력
                upperOrganizationGroupNo:
                  type: integer
                  description: 상위 계정 그룹 번호 계정 그룹 목록 조회 참조 폴더 구조로 최대 5단계까지 입력 가능
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  organizationGroupNo:
                    type: integer
                    description: 계정 그룹 번호
                  organizationGroupName:
                    type: string
                    description: 계정 그룹 이름
                  upperOrganizationGroupNo:
                    type: integer
                    description: 상위 계정 그룹 번호
                  wholePath:
                    type: string
                    description: 계정 그룹 계층 구조 계정 그룹 번호 기준
                  wholePathName:
                    type: string
                    description: 계정 그룹 계층 구조 계정 그룹 이름 기준
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
  /open-api/v1/group/move:
    post:
      operationId: PostGroupMove
      summary: 계정 그룹 이동
      description: Classic/VPC 환경에서 이용 가능합니다.
      tags:
        - organization

      x-ncloud-source: https://api.ncloud-docs.com/docs/organization-post-group-move
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - organizationGroupNo
                - upperOrganizationGroupNo
                - groupYn
                - wholePath
              properties:
                organizationGroupNo:
                  type: integer
                  description: 계정 그룹 번호 계정 그룹 목록 조회 참조
                upperOrganizationGroupNo:
                  type: integer
                  description: 상위 계정 그룹 번호 계정 그룹 목록 조회 참조 원하는 위치 바로 위에 있는 계정 그룹 번호 입력
                groupYn:
                  type: string
                  description: '계정 그룹 여부 Y | N Y : 계정 그룹 N : 계정 그룹 아님 Y 입력해야 정상 동작'
                wholePath:
                  type: string
                  description: 계정 그룹 계층 구조 마스터 계층부터 대상 그룹 위치까지 전체 경로 입력 계층 구분은 / 사용
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  displayName:
                    type: string
                    description: 계정 그룹/계정 이름
                  organizationGroupNo:
                    type: integer
                    description: 계정 그룹 번호
                  organizationGroupName:
                    type: string
                    description: 계정 그룹 이름
                  upperOrganizationGroupNo:
                    type: integer
                    description: 상위 계정 그룹 번호
                  memberNo:
                    type: integer
                    description: 계정 회원 번호
                  memberName:
                    type: string
                    description: 계정 사용자 이름
                  memberAlias:
                    type: string
                    description: '계정 Alias(별칭) 마스터 계정: Master 표시 멤버 계정: 콘솔에서 Alias 설정 시 표시'
                  loginId:
                    type: string
                    description: 계정 로그인 아이디
                  memberStatusCode:
                    type: string
                    description: 계정 상태 코드
                  memberStatusName:
                    type: string
                    description: 계정 상태
                  wholePath:
                    type: string
                    description: 계정 그룹 계층 구조
                  policyNo:
                    type: integer
                    description: 정책 번호
                  policyName:
                    type: string
                    description: 정책 이름
                  groupYn:
                    type: string
                    description: '계정 그룹 여부 Y | N Y : 계정 그룹 N : 계정 그룹 아님'
                  masterMemberYn:
                    type: string
                    description: '마스터 계정 여부 Y | N Y : 마스터 계정 N : 마스터 계정 아님'
                  modYmdt:
                    type: string
                    description: 생성/가입 일시(밀리초) Unix Timestamp 형식
                  orgNoForLev:
                    type: integer
                    description: 계정 그룹 번호
                  leaveReqYmdt:
                    type: string
                    description: 탈퇴 신청 일시 탈퇴 신청 시 표시
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
