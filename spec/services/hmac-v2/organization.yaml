openapi: 3.0.3
info:
  title: organization
  description: organization
  version: 1.0.0
  x-ncloud-availability:
    public: true
    financial: false
    gov: false

  x-ncloud-nrn:

    productName: Organization
    resource_types:
      - Organization
      - AccountGroup
      - QuotaPolicy

servers:
  - url: https://organization.apigw.ntruss.com
    description: organization 민간
    x-ncloud-env: public
security:
  - ncpAccessKey: []
    ncpTimestamp: []
    ncpHmacV2: []
paths:
  /open-api/v1/account/accept:
    post:
      operationId: PostAccountAccept
      summary: 초대 승인
      description: Classic/VPC 환경에서 이용 가능합니다.
      tags:
        - organization

      x-ncloud-source: https://api.ncloud-docs.com/docs/organization-post-account-accept
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - masterMemberNo
                - organizationNo
                - pinCode
              properties:
                masterMemberNo:
                  type: integer
                  description: 마스터 계정 회원 번호 마스터 계정에서 받은 정보 입력
                organizationNo:
                  type: integer
                  description: Organization 번호 마스터 계정에서 받은 정보 입력
                pinCode:
                  type: string
                  description: 인증용 핀 코드 수신한 Organization 초대 알림 메일에서 확인
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: API 처리 결과
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
  /open-api/v1/account/group/{organizationGroupNo}:
    get:
      operationId: GetAccountGroup
      summary: 계정 목록 조회
      description: Classic/VPC 환경에서 이용 가능합니다.
      tags:
        - organization

      x-ncloud-source: https://api.ncloud-docs.com/docs/organization-get-account-group
      parameters:
        - name: organizationGroupNo
          in: path
          required: true
          schema:
            type: integer
          description: 계정 그룹 번호 계정 그룹 목록 조회 참조
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  memberNo:
                    type: integer
                    description: 계정 회원 번호
                  organizationNo:
                    type: integer
                    description: Organization 번호
                  organizationGroupNo:
                    type: integer
                    description: 계정 그룹 번호
                  masterMemberNo:
                    type: integer
                    description: 마스터 계정 회원 번호
                  masterMemberYn:
                    type: string
                    description: '마스터 계정 여부 Y | N Y : 마스터 계정 N : 마스터 계정 아님'
                  loginId:
                    type: string
                    description: 계정 로그인 아이디
                  memberName:
                    type: string
                    description: 계정 사용자 이름
                  memberAlias:
                    type: string
                    description: 멤버 계정 Alias(별칭) 콘솔에서 Alias 설정 시 표시
                  memberStatusCode:
                    type: string
                    description: 계정 상태 코드
                  memberStatusName:
                    type: string
                    description: 계정 상태
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
  /open-api/v1/account/invite:
    post:
      operationId: PostAccountInvite
      summary: 계정 초대
      description: Classic/VPC 환경에서 이용 가능합니다.
      tags:
        - organization

      x-ncloud-source: https://api.ncloud-docs.com/docs/organization-post-account-invite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - loginId
                - memberName
                - inviteMessage
              properties:
                loginId:
                  type: string
                  description: 초대 계정 로그인 아이디
                memberName:
                  type: string
                  description: 초대 계정 사용자 이름
                inviteMessage:
                  type: string
                  description: 초대 메시지
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: API 처리 결과
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
  /open-api/v1/account/invite/invitation:
    get:
      operationId: GetAccountInvite
      summary: 초대 목록 조회
      description: Classic/VPC 환경에서 이용 가능합니다.
      tags:
        - organization

      x-ncloud-source: https://api.ncloud-docs.com/docs/organization-get-account-invite
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  organizationNo:
                    type: integer
                    description: Organization 번호
                  memberNo:
                    type: integer
                    description: 초대 계정 회원 번호
                  memberName:
                    type: string
                    description: 초대 계정 사용자 이름
                  memberEmailAddress:
                    type: string
                    description: 초대 계정 사용자 메일 주소
                  masterMemberNo:
                    type: integer
                    description: 마스터 계정 회원 번호
                  masterMemberName:
                    type: string
                    description: 마스터 계정 사용자 이름
                  masterMemberEmailAddress:
                    type: string
                    description: 마스터 계정 사용자 메일 주소
                  expireDay:
                    type: integer
                    description: 초대 만료 기한(일)
                  regYmdt:
                    type: integer
                    description: 초대 일시(밀리초) Unix Timestamp 형식
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
  /open-api/v1/account/leave:
    get:
      operationId: GetAccountLeave
      summary: 탈퇴 신청 목록 조회
      description: Classic/VPC 환경에서 이용 가능합니다.
      tags:
        - organization

      x-ncloud-source: https://api.ncloud-docs.com/docs/organization-get-account-leave
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  memberNo:
                    type: integer
                    description: 멤버 계정 회원 번호
                  organizationNo:
                    type: integer
                    description: Organization 번호
                  masterMemberNo:
                    type: integer
                    description: 마스터 계정 회원 번호
                  loginId:
                    type: string
                    description: 멤버 계정 로그인 아이디
                  memberName:
                    type: string
                    description: 멤버 계정 사용자 이름
                  memberStatusCode:
                    type: string
                    description: '멤버 계정 상태 코드 LVREQ : 탈퇴 신청 (유효 값)'
                  modYmdt:
                    type: integer
                    description: 탈퇴 신청 일시(밀리초) Unix Timestamp 형식
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
    post:
      operationId: PostAccountLeave
      summary: 탈퇴 신청 승인 및 거절
      description: Classic/VPC 환경에서 이용 가능합니다.
      tags:
        - organization

      x-ncloud-source: https://api.ncloud-docs.com/docs/organization-post-account-leave
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - memberNo
                - organizationNo
                - leavePermission
              properties:
                memberNo:
                  type: integer
                  description: 멤버 계정 회원 번호 계정 목록 조회 참조
                organizationNo:
                  type: integer
                  description: Organization 번호 계정 목록 조회 참조
                leavePermission:
                  type: string
                  description: '탈퇴 신청 승인 여부 ACCPT | RJCT ACCPT : 승인 RJCT : 반려'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: API 처리 결과
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
  /open-api/v1/account/leave/force:
    post:
      operationId: GetAccountLeaveForCe
      summary: 강제 탈퇴
      description: Classic/VPC 환경에서 이용 가능합니다.
      tags:
        - organization

      x-ncloud-source: https://api.ncloud-docs.com/docs/organization-get-account-leave-force
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - memberNo
                - memberName
              properties:
                memberNo:
                  type: integer
                  description: 멤버 계정 회원 번호 계정 목록 조회 참조
                memberName:
                  type: string
                  description: 멤버 계정 사용자 이름 계정 목록 조회 참조
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: API 처리 결과
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
  /open-api/v1/account/reject:
    post:
      operationId: PostAccountReject
      summary: 초대 거절
