          description: 플레이어 이름 영문자, 숫자, 특수 문자 '_', '-', '@'를 조합하여 3~30자 이내로 입력 문자열 시작은 영문자로 구성
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: 응답 코드
                  message:
                    type: string
                    description: '이름 체크 결과 사용 가능한 이름인 경우: ok 사용 불가능한 이름인 경우: 사용 불가능 이유'
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
