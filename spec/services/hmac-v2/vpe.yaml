openapi: 3.0.3
info:
  title: vpe
  description: vpe
  version: 1.0.0
  x-ncloud-availability:
    public: true
    financial: false
    gov: true

  x-ncloud-nrn-todo: true
servers:
  - url: https://vpe.apigw.ntruss.com
    description: vpe 민간
    x-ncloud-env: public
  - url: https://vpe.apigw.gov-ntruss.com
    description: vpe 공공
    x-ncloud-env: gov
security:
  - ncpAccessKey: []
    ncpTimestamp: []
    ncpHmacV2: []
paths:
  /players:
    get:
      operationId: List
      summary: 플레이어 목록 조회
      description: Classic/VPC 환경에서 이용 가능합니다.
      tags:
        - vpe

      x-ncloud-source: https://api.ncloud-docs.com/docs/vpe-api-list
      parameters:
        - name: page_no
          in: query
          required: false
          schema:
            type: integer
          description: '페이지 번호 1~1000 (기본값: 1)'
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
          description: '페이지당 항목 수 10~1000 (기본값: 10)'
        - name: sort_type
          in: query
          required: false
          schema:
            type: string
          description: '생성일 기준 정렬 순서 desc (기본값) | asc desc : 내림차순 asc : 오름차순'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: 응답 코드
                  message:
                    type: string
                    description: 응답 메시지
                  result:
                    type: object
                    additionalProperties: true
                    description: 응답 결과
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
    post:
      operationId: Create
      summary: 플레이어 생성
      description: Classic/VPC 환경에서 이용 가능합니다.
      tags:
        - vpe

      x-ncloud-source: https://api.ncloud-docs.com/docs/vpe-api-create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - domains
                - name
                - type
                - domain
              properties:
                auto_update:
                  type: string
                  description: '플레이어 SDK 자동 업데이트 여부 Y (기본값) | N Y : 사용 N : 사용 안 함'
                domains:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                  description: '사이트 도메인 목록: domains'
                name:
                  type: string
                  description: "플레이어 이름 영문자, 숫자, 특수 문자 '_', '-', '@'를 조합하여 3~30자 이내로 입력 문자열 시작은 영문자로 구성 중복 및 유효성 검증: 플레이어 이름 체크 참조"
                version:
                  type: string
                  description: 플레이어 SDK 버전 플레이어 SDK 버전 조회 참조 미입력 시 최신 버전으로 생성
                type:
                  type: string
                  description: '사이트 도메인 유형 web | ios | aos web : 웹사이트 URL ios : iOS 앱 패키지 아이디 aos : Android 앱 패키지 아이디'
                domain:
                  type: string
                  description: 도메인 또는 모바일 앱 패키지 아이디
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: 응답 코드
                  message:
                    type: string
                    description: 응답 메시지
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
  /players/checkName:
    get:
      operationId: CheckName
      summary: 플레이어 이름 체크
      description: Classic/VPC 환경에서 이용 가능합니다.
