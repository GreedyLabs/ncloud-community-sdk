                    description: 응답 코드
                  message:
                    type: string
                    description: 응답 메시지
                  result:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                    description: '버전 목록: result'
        4XX:
          $ref: '#/components/responses/NcloudClientError'
        5XX:
          $ref: '#/components/responses/NcloudServerError'
