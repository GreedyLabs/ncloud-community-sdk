name: cli-release

# Matrix build + archive layout live in cli/.goreleaser.yaml.
# CLI is the project's "main" component — bare `vX.Y.Z` tags. SDK uses
# `sdk/vX.Y.Z` because Go's module proxy requires the prefix for
# subdirectory modules.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: cli/go.sum
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          workdir: cli
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
