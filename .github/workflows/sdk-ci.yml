name: sdk-ci

# Listens to spec/** because the SDK is generated from spec.
on:
  push:
    branches: [main]
    paths:
      - 'sdk/**'
      - 'spec/**'
      - '.github/workflows/sdk-ci.yml'
  pull_request:
    paths:
      - 'sdk/**'
      - 'spec/**'
      - '.github/workflows/sdk-ci.yml'

concurrency:
  group: sdk-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: sdk/go.sum
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
