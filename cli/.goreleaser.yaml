# GoReleaser config for the `ncc` CLI.
#
# Driven by .github/workflows/cli-release.yml on bare `vX.Y.Z` tags
# at the repo root. Emits artifacts named `ncc_X.Y.Z_<os>_<arch>`.
version: 2

project_name: ncc

before:
  hooks:
    - go mod tidy
    # LICENSE only exists at the repo root; copy it into cli/ so the
    # archives.files block can reference it as a normal local file.
    - cp ../LICENSE LICENSE

builds:
  - id: ncc
    main: .
    binary: ncc
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/greedylabs/ncloud-community-sdk/cli/cmd.version={{.Version}}
      - -X github.com/greedylabs/ncloud-community-sdk/cli/cmd.commit={{.ShortCommit}}
      - -X github.com/greedylabs/ncloud-community-sdk/cli/cmd.date={{.Date}}

archives:
  - id: ncc
    ids: [ncc]
    formats: [tar.gz]
    format_overrides:
      - { goos: windows, formats: [zip] }
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE   # copied from repo root by the `before` hook above
      - README.md # cli/README.md (CLI-specific)

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

release:
  github:
    owner: GreedyLabs
    name: ncloud-community-sdk
  header: |
    ## ncc {{ .Version }}

    Download a binary from the assets below and put it on your `$PATH`.
